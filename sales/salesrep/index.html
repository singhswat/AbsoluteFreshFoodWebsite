<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-FL4T5WHM8W"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-FL4T5WHM8W');
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Absolute Fresh Food</title>
  <script>
    // If already logged in via unified login, go straight to dashboard
    try {
      const s = JSON.parse(sessionStorage.getItem('aff_session') || 'null');
      if (s && (s.role === 'rep' || s.role === 'driver' || s.role === 'admin')) {
        location.replace('pages/dashboard.html');
      }
    } catch(e) {}
    // Not logged in — send to unified login
    if (!sessionStorage.getItem('aff_session')) {
      location.replace('../login.html');
    }
  </script>
  <link rel="manifest" href="../manifest.json"/>
  <meta name="theme-color" content="#1E293B"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-title" content="AFF Sales"/>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-logo">🥬</div>
      <h1 class="login-title">Absolute Fresh Food</h1>
      <p class="login-sub" id="login-sub">Sales Operations Platform</p>

      <div id="error-box" class="alert alert-red"></div>

      <div class="form-group">
        <label id="lbl-email">Email</label>
        <input id="email" type="email" class="form-input"
               placeholder="you@absolutefreshfood.com" />
      </div>
      <div class="form-group">
        <label id="lbl-pwd">Password</label>
        <input id="password" type="password" class="form-input"
               placeholder="••••••••" />
      </div>

      <button id="login-btn" class="btn btn-primary btn-full"
              onclick="signIn()">Sign In →</button>

      <div style="text-align:center;margin-top:1.25rem;display:flex;gap:10px;justify-content:center">
        <button class="lang-btn" onclick="toggleLang()">हिंदी / EN</button>
        <button class="lang-btn" onclick="flushSession()"
                style="background:var(--red-bg);border-color:#991b1b;color:var(--red)">
          ↺ Clear Session
        </button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/app.js"></script>
  <script>
    // Apply language
    document.getElementById('login-sub').textContent =
      lang === 'hi' ? 'बिक्री संचालन प्लेटफॉर्म' : 'Sales Operations Platform';
    document.getElementById('lbl-email').textContent = t('email');
    document.getElementById('lbl-pwd').textContent   = t('password');
    document.getElementById('login-btn').textContent = t('login') + ' →';

    // Check if already logged in — with loop protection
    (async () => {
      try {
        const { data: { session } } = await db.auth.getSession();
        if (session) {
          // Verify profile exists before redirecting
          const { data: profile } = await db.from('users')
            .select('role, is_active').eq('id', session.user.id).single();
          if (profile && profile.is_active) {
            redirect(session, profile);
          } else if (!profile) {
            // No profile — stay on login page, don't redirect
            await db.auth.signOut();
          }
        }
      } catch(e) {
        console.log('Session check error:', e);
      }
    })();

    async function signIn() {
      const email = document.getElementById('email').value.trim();
      const pwd   = document.getElementById('password').value;
      const btn   = document.getElementById('login-btn');
      const err   = document.getElementById('error-box');

      if (!email || !pwd) {
        err.textContent = 'Please enter email and password';
        err.classList.add('show');
        return;
      }

      loading(btn, true, t('login'));
      err.classList.remove('show');

      const { data, error } = await db.auth.signInWithPassword({ email, password: pwd });

      if (error) {
        err.textContent = error.message.includes('Invalid') ?
          'Invalid email or password' : error.message;
        err.classList.add('show');
        loading(btn, false, t('login') + ' →');
        return;
      }

      redirect(data.session);
    }

    async function redirect(session, existingProfile) {
      const profile = existingProfile || (await db.from('users')
        .select('role, is_active').eq('id', session.user.id).single()).data;

      if (!profile) {
        document.getElementById('error-box').textContent =
          'Profile not found. Contact admin.';
        document.getElementById('error-box').classList.add('show');
        await db.auth.signOut();
        return;
      }

      if (!profile.is_active) {
        document.getElementById('error-box').textContent =
          'Account pending approval. Contact admin.';
        document.getElementById('error-box').classList.add('show');
        await db.auth.signOut();
        return;
      }

      if (profile.role === 'admin') {
        window.location.href = 'pages/dashboard.html';
      } else if (profile.role === 'rep') {
        window.location.href = 'pages/beat.html';
      } else if (profile.role === 'driver') {
        window.location.href = 'pages/deliveries.html';
      }
    }

    async function flushSession() {
      await db.auth.signOut();
      localStorage.clear();
      sessionStorage.clear();
      // Clear all cookies
      document.cookie.split(';').forEach(c => {
        document.cookie = c.replace(/^ +/, '').replace(/=.*/, '=;expires=Thu, 01 Jan 1970 00:00:00 UTC;path=/');
      });
      location.reload();
    }

    function toggleLang() {
      setLang(lang === 'en' ? 'hi' : 'en');
    }

    // Enter key support
    document.getElementById('password').addEventListener('keypress', e => {
      if (e.key === 'Enter') signIn();
    });
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('../sw.js')
        .then(() => console.log('SW registered'))
        .catch(e => console.log('SW error:', e));
    }
  </script>
</body>
</html>
