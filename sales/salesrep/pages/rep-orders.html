<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Orders — AFF</title>
  <link rel="stylesheet" href="../css/style.css"/>
  <meta name="theme-color" content="#1E293B"/>
  <style>
    body{background:#0F172A;color:#CBD5E1;font-family:system-ui,sans-serif;margin:0}
    html,body{height:100%;overflow-x:hidden}
    .top-bar{background:#1E293B;border-bottom:1px solid #334155;padding:10px 14px;display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:50}
    .top-bar h1{font-size:.95rem;font-weight:700;color:#F1F5F9;flex:1}
    .page-wrap{padding:10px 12px 90px}
    .filter-bar{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:4px}
    .filter-bar::-webkit-scrollbar{display:none}
    .fbtn{background:#1E293B;border:1px solid #334155;color:#94A3B8;border-radius:20px;padding:5px 12px;font-size:.72rem;font-weight:600;cursor:pointer;white-space:nowrap}
    .fbtn.active{background:#2563EB;border-color:#2563EB;color:#fff}
    .order-card{background:#1E293B;border:1px solid #334155;border-radius:12px;padding:14px;margin-bottom:8px}
    .order-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
    .order-outlet{font-size:.88rem;font-weight:700;color:#F1F5F9}
    .order-date{font-size:.72rem;color:#64748B}
    .order-meta{font-size:.76rem;color:#94A3B8;margin-bottom:8px}
    .order-footer{display:flex;justify-content:space-between;align-items:center}
    .order-val{font-size:.9rem;font-weight:700;font-family:monospace;color:#FBBF24}
    .status-badge{font-size:.65rem;padding:3px 9px;border-radius:20px;font-weight:700}
    .s-pending{background:#78350f;color:#FBBF24}
    .s-delivered{background:#14532d;color:#4ADE80}
    .s-cancelled{background:#3f1d1d;color:#F87171}
    .empty{text-align:center;padding:40px;color:#64748B;font-size:.85rem}
    .rep-bot-nav{position:fixed;bottom:0;left:0;right:0;background:#1E293B;border-top:1px solid #334155;display:flex;z-index:9999;padding-bottom:env(safe-area-inset-bottom)}
    .rep-bot-nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 4px;font-size:.6rem;color:#64748B;text-decoration:none;gap:2px;-webkit-tap-highlight-color:transparent}
    .rep-bot-nav a.active{color:#60A5FA}
    .rep-bot-nav a span{font-size:1.2rem;line-height:1}
  </style>
</head>
<body>

<div class="top-bar">
  <h1>📝 My Orders</h1>
  <span id="order-count" style="font-size:.72rem;color:#64748B"></span>
</div>

<div class="page-wrap">
  <div class="filter-bar">
    <button class="fbtn active" onclick="setFilter('all',this)">All</button>
    <button class="fbtn" onclick="setFilter('pending',this)">Pending</button>
    <button class="fbtn" onclick="setFilter('delivered',this)">Delivered</button>
    <button class="fbtn" onclick="setFilter('today',this)">Today</button>
    <button class="fbtn" onclick="setFilter('week',this)">This Week</button>
  </div>
  <div id="order-list"><div class="empty">Loading...</div></div>
</div>

<nav class="rep-bot-nav">
  <a href="beat.html"><span>📋</span>Beat</a>
  <a href="rep-outlets.html"><span>🏪</span>Outlets</a>
  <a href="stock.html"><span>📦</span>Stock</a>
  <a href="rep-orders.html" class="active"><span>📝</span>Orders</a>
  <a href="settings.html"><span>⚙️</span>More</a>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const db = supabase.createClient('https://fbfopgzblqmsflkfejwa.supabase.co','sb_publishable_r7mYhsyIKtBjBKzxH8St9g_OHjTU-RQ');
let currentUser, allOrders = [], activeFilter = 'all';

async function init() {
  const raw = sessionStorage.getItem('aff_session');
  if (!raw) { location.href = '../index.html'; return; }
  currentUser = JSON.parse(raw);
  await loadOrders();
}

async function loadOrders() {
  const isAdmin = currentUser.role === 'admin';
  let q = db.from('orders')
    .select('id,date,delivery_date,status,notes,outlets(name,area),order_items(kg_ordered,unit_price,discount_amount,products(name))')
    .order('date', {ascending: false})
    .limit(100);
  if (!isAdmin) q = q.eq('rep_id', currentUser.id);
  const { data } = await q;
  allOrders = data || [];
  document.getElementById('order-count').textContent = allOrders.length + ' orders';
  renderOrders();
}

function setFilter(f, btn) {
  activeFilter = f;
  document.querySelectorAll('.fbtn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderOrders();
}

function renderOrders() {
  const today = new Date().toISOString().split('T')[0];
  const weekAgo = new Date(Date.now() - 7*86400000).toISOString().split('T')[0];
  let orders = allOrders;
  if (activeFilter === 'pending') orders = orders.filter(o => o.status === 'pending');
  else if (activeFilter === 'delivered') orders = orders.filter(o => o.status === 'delivered');
  else if (activeFilter === 'today') orders = orders.filter(o => o.date === today);
  else if (activeFilter === 'week') orders = orders.filter(o => o.date >= weekAgo);

  const el = document.getElementById('order-list');
  if (!orders.length) { el.innerHTML = '<div class="empty">No orders found</div>'; return; }

  el.innerHTML = orders.map(o => {
    const items = o.order_items || [];
    const value = items.reduce((s,i) => s + (Number(i.kg_ordered) * Number(i.unit_price)) - Number(i.discount_amount||0), 0);
    const products = items.map(i => `${i.products?.name||'—'} × ${i.kg_ordered}kg`).join(', ');
    const dDate = o.delivery_date ? ` · Deliver ${o.delivery_date}` : '';
    const sCls = o.status === 'delivered' ? 's-delivered' : o.status === 'cancelled' ? 's-cancelled' : 's-pending';
    return `<div class="order-card">
      <div class="order-top">
        <div class="order-outlet">${o.outlets?.name||'—'} <span style="font-weight:400;color:#64748B">· ${o.outlets?.area||''}</span></div>
        <div class="order-date">${o.date}${dDate}</div>
      </div>
      <div class="order-meta">${products}${o.notes ? ' · ' + o.notes : ''}</div>
      <div class="order-footer">
        <div class="order-val">${value > 0 ? '₹' + value.toFixed(0) : '₹—'}</div>
        <span class="status-badge ${sCls}">${o.status}</span>
      </div>
    </div>`;
  }).join('');
}

init();
</script>
</body>
</html>
