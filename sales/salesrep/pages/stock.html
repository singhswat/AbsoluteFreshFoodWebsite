<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Stock — AFF</title>
  <link rel="stylesheet" href="../css/style.css"/>
  <meta name="theme-color" content="#1E293B"/>
  <style>
    *{box-sizing:border-box}
    html,body{height:100%;overflow-x:hidden;background:#0F172A;color:#CBD5E1;font-family:system-ui,sans-serif;margin:0}

    /* Top bar */
    .top-bar{background:#1E293B;border-bottom:1px solid #334155;padding:10px 14px;display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:50}
    .top-bar h1{font-size:.95rem;font-weight:700;color:#F1F5F9;flex:1}
    .chip{background:#0c2340;color:#60A5FA;border-radius:6px;padding:2px 8px;font-size:.72rem;font-weight:600}
    .top-date{font-size:.72rem;color:#64748B}

    /* Stats strip */
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px 12px 0}
    .sc{background:#1E293B;border:1px solid #334155;border-radius:8px;padding:8px;text-align:center}
    .sl{font-size:.58rem;color:#94A3B8;text-transform:uppercase;letter-spacing:.04em}
    .sv{font-size:1.1rem;font-weight:700;font-family:monospace}
    .sv.blue{color:#60A5FA}.sv.yellow{color:#FBBF24}.sv.green{color:#4ADE80}.sv.red{color:#F87171}

    /* Main grid */
    .grid-wrap{padding:10px 12px 90px;overflow-x:auto}
    .grid-label{font-size:.7rem;color:#64748B;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
    .btn-add-row{background:#2563EB;color:#fff;border:none;border-radius:6px;padding:4px 12px;font-size:.72rem;font-weight:700;cursor:pointer}

    table{width:100%;border-collapse:collapse;font-size:.8rem}
    thead th{background:#1E293B;color:#94A3B8;font-size:.65rem;text-transform:uppercase;letter-spacing:.05em;padding:8px 8px;text-align:left;position:sticky;top:0;white-space:nowrap}
    tbody tr{border-bottom:1px solid #1E293B}
    tbody tr:nth-child(odd){background:#111827}
    tbody tr:nth-child(even){background:#0F172A}
    td{padding:6px 6px;vertical-align:middle}
    td.store-col{font-weight:600;color:#F1F5F9;min-width:100px;max-width:140px}
    td.store-col .area{font-size:.65rem;color:#64748B;font-weight:400}

    /* Inline number inputs */
    .n-inp{width:52px;background:#1E293B;border:1px solid #334155;color:#F1F5F9;border-radius:6px;padding:5px 4px;font-size:.85rem;font-family:monospace;text-align:center;outline:none}
    .n-inp:focus{border-color:#60A5FA}
    .n-inp.dirty{border-color:#FBBF24}

    /* Outstanding badge */
    .out-badge{font-size:.85rem;font-weight:700;font-family:monospace}
    .out-badge.zero{color:#4ADE80}
    .out-badge.pos{color:#FBBF24}

    /* Action buttons */
    .act-btn{border:none;border-radius:6px;padding:5px 8px;font-size:.72rem;font-weight:700;cursor:pointer;white-space:nowrap}
    .btn-save{background:#2563EB;color:#fff}
    .btn-settle{background:#16A34A;color:#fff}
    .btn-del{background:#334155;color:#94A3B8}

    /* Add row form */
    .add-row-form{background:#1E293B;border:1px solid #334155;border-radius:12px;padding:14px;margin-bottom:10px;display:none}
    .add-row-form.open{display:block}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .flbl{font-size:.68rem;color:#94A3B8;display:block;margin-bottom:3px;text-transform:uppercase}
    .finp{width:100%;background:#0F172A;border:1px solid #334155;color:#F1F5F9;border-radius:7px;padding:7px 9px;font-size:.82rem;outline:none}
    .finp:focus{border-color:#60A5FA}
    .fgrp{margin-bottom:8px}
    .btn-row{display:flex;gap:8px;margin-top:8px}
    .btn-full{flex:1;padding:9px;border-radius:8px;font-size:.82rem;font-weight:700;cursor:pointer;border:none}
    .btn-blue{background:#2563EB;color:#fff}
    .btn-ghost{background:#334155;color:#CBD5E1}

    /* Settle sheet */
    .sheet-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;align-items:flex-end}
    .sheet-overlay.open{display:flex}
    .sheet{background:#1E293B;border-radius:16px 16px 0 0;padding:20px 16px 36px;width:100%;max-height:88vh;overflow-y:auto}
    .sheet-h{font-size:.95rem;font-weight:700;color:#F1F5F9;margin-bottom:4px}
    .sheet-sub{font-size:.75rem;color:#64748B;margin-bottom:16px}
    .info-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #334155;font-size:.8rem}
    .info-row:last-of-type{border:none}
    .info-val{font-weight:700;font-family:monospace}
    .btn-green-full{width:100%;padding:12px;background:#16A34A;color:#fff;border:none;border-radius:9px;font-size:.88rem;font-weight:700;cursor:pointer;margin-top:12px}
    .btn-cancel-full{width:100%;padding:10px;background:#334155;color:#CBD5E1;border:none;border-radius:9px;font-size:.82rem;font-weight:700;cursor:pointer;margin-top:6px}

    /* Bottom nav */
    .rep-bot-nav{position:fixed;bottom:0;left:0;right:0;background:#1E293B;border-top:1px solid #334155;display:flex;z-index:9999;padding-bottom:env(safe-area-inset-bottom)}
    .rep-bot-nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 4px;font-size:.6rem;color:#64748B;text-decoration:none;gap:2px;-webkit-tap-highlight-color:transparent}
    .rep-bot-nav a.active{color:#60A5FA}
    .rep-bot-nav a span{font-size:1.2rem;line-height:1}

    .toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#16A34A;color:#fff;padding:10px 20px;border-radius:8px;font-size:.82rem;font-weight:600;z-index:300;display:none;white-space:nowrap}
    .empty{text-align:center;padding:30px;color:#64748B;font-size:.82rem}
  </style>
</head>
<body>

<div class="top-bar">
  <h1>📦 Stock</h1>
  <input type="date" id="sel-date" style="background:#0F172A;border:1px solid #334155;color:#F1F5F9;border-radius:6px;padding:4px 8px;font-size:.78rem;outline:none;max-width:130px" onchange="loadGrid()"/>
  <span class="chip" id="rep-chip">Rep</span>
</div>

<!-- Stats -->
<div class="stats">
  <div class="sc"><div class="sl">Picked</div><div class="sv blue" id="s-picked">0</div></div>
  <div class="sc"><div class="sl">At Outlets</div><div class="sv yellow" id="s-outlets">0</div></div>
  <div class="sc"><div class="sl">Returned</div><div class="sv green" id="s-returned">0</div></div>
  <div class="sc"><div class="sl">Settled</div><div class="sv red" id="s-settled">0</div></div>
</div>

<!-- Main grid -->
<div class="grid-wrap">
  <div class="grid-label">
    <span>Today's Stores</span>
    <button class="btn-add-row" onclick="toggleAddRow()">+ Add Store</button>
  </div>

  <!-- Add row form -->
  <div class="add-row-form" id="add-row-form">
    <div class="fgrp"><label class="flbl">Store / Outlet</label><select class="finp" id="ar-outlet"></select></div>
    <div class="form-row">
      <div class="fgrp"><label class="flbl">Product</label><select class="finp" id="ar-product"></select></div>
      <div class="fgrp"><label class="flbl">Packets Picked</label><input class="finp" type="number" id="ar-qty" min="1" placeholder="0"/></div>
    </div>
    <div class="fgrp"><label class="flbl">Notes</label><input class="finp" type="text" id="ar-notes" placeholder="e.g. sample, morning batch"/></div>
    <div class="btn-row">
      <button class="btn-full btn-ghost" onclick="toggleAddRow()">Cancel</button>
      <button class="btn-full btn-blue" onclick="addRow()">✅ Save Pickup</button>
    </div>
  </div>

  <!-- Data grid -->
  <div id="grid-container">
    <div class="empty">Loading...</div>
  </div>
</div>

<!-- Settle bottom sheet -->
<div class="sheet-overlay" id="settle-sheet" onclick="if(event.target===this)closeSettle()">
  <div class="sheet">
    <div class="sheet-h" id="sh-name">Settle Outlet</div>
    <div class="sheet-sub" id="sh-sub"></div>
    <div id="sh-info"></div>
    <div class="fgrp" style="margin-top:12px"><label class="flbl">Packets Sold</label><input class="finp" type="number" id="sh-sold" min="0" placeholder="0" oninput="calcSheet()"/></div>
    <div class="fgrp"><label class="flbl">Packets Returned Now</label><input class="finp" type="number" id="sh-returning" min="0" placeholder="0" oninput="calcSheet()"/></div>
    <div style="background:#0F172A;border-radius:8px;padding:12px;margin:8px 0">
      <div class="info-row"><span style="color:#94A3B8">Amount Due</span><span class="info-val" id="sh-due" style="color:#FBBF24">₹0</span></div>
    </div>
    <div class="fgrp"><label class="flbl">Cash Collected (₹)</label><input class="finp" type="number" id="sh-collected" min="0" placeholder="0"/></div>
    <div class="fgrp"><label class="flbl">Payment Method</label>
      <select class="finp" id="sh-method">
        <option value="cash">Cash</option>
        <option value="upi">UPI</option>
        <option value="pending">Pending / Credit</option>
      </select>
    </div>
    <button class="btn-green-full" onclick="completeSettle()">✅ Settle & Generate Invoice</button>
    <button class="btn-cancel-full" onclick="closeSettle()">Cancel</button>
  </div>
</div>

<!-- Success Sheet -->
<div class="sheet-overlay" id="success-sheet">
  <div class="sheet" style="text-align:center">
    <div style="font-size:2.5rem;margin-bottom:8px">✅</div>
    <div style="font-size:1rem;font-weight:700;color:#4ADE80;margin-bottom:4px">Settlement Done!</div>
    <div style="font-size:.8rem;color:#94A3B8;margin-bottom:16px" id="ss-outlet"></div>
    <div style="background:#0F172A;border-radius:10px;padding:14px;margin-bottom:16px;text-align:left">
      <div class="info-row"><span style="color:#94A3B8">Invoice</span><span class="info-val" id="ss-inv" style="color:#60A5FA"></span></div>
      <div class="info-row"><span style="color:#94A3B8">Sold</span><span class="info-val" id="ss-sold"></span></div>
      <div class="info-row"><span style="color:#94A3B8">Amount</span><span class="info-val" id="ss-amount" style="color:#FBBF24"></span></div>
      <div class="info-row"><span style="color:#94A3B8">Collected</span><span class="info-val" id="ss-collected"></span></div>
      <div class="info-row"><span style="color:#94A3B8">Status</span><span class="info-val" id="ss-status"></span></div>
    </div>
    <button onclick="shareWhatsApp()" style="width:100%;padding:13px;background:#25D366;color:#fff;border:none;border-radius:10px;font-size:.9rem;font-weight:700;cursor:pointer;margin-bottom:8px">📱 Share Invoice on WhatsApp</button>
    <button onclick="document.getElementById('success-sheet').classList.remove('open')" style="width:100%;padding:10px;background:#334155;color:#CBD5E1;border:none;border-radius:10px;font-size:.82rem;font-weight:700;cursor:pointer">Close</button>
  </div>
</div>

<!-- Bottom nav -->
<nav class="rep-bot-nav">
  <a href="beat.html"><span>📋</span>Beat</a>
  <a href="rep-outlets.html"><span>🏪</span>Outlets</a>
  <a href="stock.html" class="active"><span>📦</span>Stock</a>
  <a href="rep-orders.html"><span>📝</span>Orders</a>
  <a href="rep-more.html"><span>⚙️</span>More</a>
</nav>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const db = supabase.createClient('https://fbfopgzblqmsflkfejwa.supabase.co','sb_publishable_r7mYhsyIKtBjBKzxH8St9g_OHjTU-RQ');
let currentUser, products=[], outlets=[], rowData={}, settleTarget=null;
const today = new Date().toISOString().split('T')[0];

async function init() {
  const raw = sessionStorage.getItem('aff_session');
  if (!raw) { location.href='../index.html'; return; }
  currentUser = JSON.parse(raw);
  if (currentUser.role==='admin') { location.href='stock-admin.html'; return; }
  document.getElementById('rep-chip').textContent = currentUser.name||'Rep';
  document.getElementById('sel-date').value = today;

  const [pd, od] = await Promise.all([
    db.from('products').select('id,name,base_price').eq('is_active',true),
    db.from('outlets').select('id,name,area,price_tier').eq('status','active').order('name')
  ]);
  products = pd.data||[];
  outlets = od.data||[];

  const pOpts = products.map(p=>`<option value="${p.id}" data-price="${p.base_price}">${p.name}</option>`).join('');
  const oOpts = outlets.map(o=>`<option value="${o.id}">${o.name} — ${o.area}</option>`).join('');
  document.getElementById('ar-product').innerHTML = pOpts;
  document.getElementById('ar-outlet').innerHTML = '<option value="">-- Select Store --</option>'+oOpts;

  await loadGrid();
}

// ── Load grid data ────────────────────────────────────────────────────
async function loadGrid() {
  const selDate = document.getElementById('sel-date').value || today;
  const { data: movs } = await db.from('stock_movements')
    .select('id,outlet_id,qty_packets,movement_type,product_id,notes,outlets(name,area),products(name,base_price)')
    .eq('rep_id', currentUser.id)
    .eq('date', selDate)
    .not('outlet_id','is',null);

  // Group by outlet
  rowData = {};
  (movs||[]).forEach(m => {
    const id = m.outlet_id;
    if (!rowData[id]) rowData[id] = {
      name:m.outlets?.name, area:m.outlets?.area,
      product_id:m.product_id, product:m.products?.name,
      price:parseFloat(m.products?.base_price||0),
      picked:0, returned:0
    };
    if (m.movement_type==='warehouse_out') rowData[id].picked += m.qty_packets;
    if (m.movement_type==='returned'||m.movement_type==='discarded') rowData[id].returned += m.qty_packets;
  });

  // Check settled outlets for selected date
  const { data: settles } = await db.from('settlements').select('outlet_id,qty_sold,qty_returned,amount_collected')
    .eq('rep_id',currentUser.id)
    .gte('settled_at', selDate+'T00:00:00')
    .lte('settled_at', selDate+'T23:59:59');
  const settledMap = {};
  const settledSold = {}; // total qty_sold per outlet across all settlements
  (settles||[]).forEach(s => {
    settledMap[s.outlet_id] = s;
    settledSold[s.outlet_id] = (settledSold[s.outlet_id]||0) + (s.qty_sold||0);
  });

  // Stats
  let totalPicked=0, totalOutlets=0, totalReturned=0, totalSettled=0;
  Object.entries(rowData).forEach(([id,r]) => {
    totalPicked += r.picked;
    totalReturned += r.returned;
    const prevSold = settledSold[id]||0;
    const outstanding = r.picked - r.returned - prevSold;
    r.prevSold = prevSold; // store for settle sheet
    totalSettled += prevSold;
    if (outstanding > 0) totalOutlets += outstanding;
  });
  document.getElementById('s-picked').textContent = totalPicked;
  document.getElementById('s-outlets').textContent = totalOutlets;
  document.getElementById('s-returned').textContent = totalReturned;
  document.getElementById('s-settled').textContent = totalSettled;

  renderGrid(rowData, settledMap);
}

function renderGrid(data, settledMap) {
  const entries = Object.entries(data);
  const gc = document.getElementById('grid-container');
  if (!entries.length) { gc.innerHTML = '<div class="empty">No pickups yet today.<br>Tap "+ Add Store" to begin.</div>'; return; }

  const rows = entries.map(([id, r]) => {
    const outstanding = r.picked - r.returned - (r.prevSold||0);
    const settled = !!settledMap[id];
    const outCls = outstanding===0 ? 'zero' : 'pos';
    return `<tr>
      <td class="store-col">${r.name}<div class="area">${r.area}</div></td>
      <td><input class="n-inp" type="number" value="${r.picked}" min="0" onchange="markDirty(this,'${id}','picked',${r.price})" oninput="markDirty(this,'${id}','picked',${r.price})"/></td>
      <td><input class="n-inp" type="number" value="${r.returned}" min="0" onchange="markDirty(this,'${id}','returned',${r.price})" oninput="markDirty(this,'${id}','returned',${r.price})"/></td>
      <td><span class="out-badge ${outCls}">${outstanding}</span></td>
      <td>
        <button class="act-btn btn-save" id="save-btn-${id}" onclick="saveRow('${id}')" style="display:none;margin-right:4px">💾</button>
        ${settled ? `<span style="font-size:.7rem;color:#4ADE80;font-weight:700">✅ Done</span>` : `<button class="act-btn btn-settle" onclick="openSettle('${id}')">💰</button>`}
      </td>
    </tr>`;
  }).join('');

  gc.innerHTML = `<table>
    <thead><tr>
      <th>Store</th><th>Picked</th><th>Returned</th><th>Out</th><th>Action</th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

// ── Inline edit ───────────────────────────────────────────────────────
const dirtyRows = {};
function markDirty(inp, outletId, field, price) {
  inp.classList.add('dirty');
  if (!dirtyRows[outletId]) dirtyRows[outletId] = {};
  dirtyRows[outletId][field] = parseInt(inp.value)||0;
  const saveBtn = document.getElementById('save-btn-'+outletId);
  if (saveBtn) saveBtn.style.display = 'inline-block';
}

async function saveRow(outletId) {
  const r = rowData[outletId];
  if (!r) return;
  const changes = dirtyRows[outletId]||{};

  // Calculate delta for picked
  if (changes.picked !== undefined && changes.picked !== r.picked) {
    const delta = changes.picked - r.picked;
    if (delta > 0) {
      await db.from('stock_movements').insert({
        rep_id:currentUser.id, outlet_id:outletId, product_id:r.product_id,
        qty_packets:delta, movement_type:'warehouse_out', date:today, notes:'grid edit'
      });
    }
  }
  // Calculate delta for returned
  if (changes.returned !== undefined && changes.returned !== r.returned) {
    const delta = changes.returned - r.returned;
    if (delta > 0) {
      await db.from('stock_movements').insert({
        rep_id:currentUser.id, outlet_id:outletId, product_id:r.product_id,
        qty_packets:delta, movement_type:'returned', date:today, notes:'grid edit'
      });
    }
  }

  delete dirtyRows[outletId];
  toast('💾 Saved');
  await loadGrid();
}

// ── Add row ───────────────────────────────────────────────────────────
function toggleAddRow() {
  document.getElementById('add-row-form').classList.toggle('open');
}

async function addRow() {
  const outlet_id = document.getElementById('ar-outlet').value;
  const product_id = document.getElementById('ar-product').value;
  const qty = parseInt(document.getElementById('ar-qty').value);
  const notes = document.getElementById('ar-notes').value;
  if (!outlet_id) { alert('Select a store.'); return; }
  if (!product_id || !qty || qty<1) { alert('Select product and enter qty.'); return; }

  const { error } = await db.from('stock_movements').insert({
    rep_id:currentUser.id, outlet_id, product_id,
    qty_packets:qty, movement_type:'warehouse_out', notes, date:document.getElementById('sel-date').value||today
  });
  if (error) { alert(error.message); return; }
  document.getElementById('ar-qty').value='';
  document.getElementById('ar-notes').value='';
  document.getElementById('ar-outlet').value='';
  document.getElementById('add-row-form').classList.remove('open');
  toast('✅ Added');
  await loadGrid();
}

// ── Settle ────────────────────────────────────────────────────────────
function openSettle(outletId) {
  const r = rowData[outletId];
  const outstanding = r.picked - r.returned;
  settleTarget = {id:outletId, ...r, outstanding};
  document.getElementById('sh-name').textContent = r.name;
  document.getElementById('sh-sub').textContent = r.area + ' · ' + outstanding + ' pkts outstanding';
  // Pre-fill with outstanding qty and expected amount
  document.getElementById('sh-sold').value = outstanding > 0 ? outstanding : '';
  document.getElementById('sh-returning').value = '';
  document.getElementById('sh-collected').value = outstanding > 0 ? (outstanding * r.price).toFixed(0) : '';
  document.getElementById('sh-due').textContent = outstanding > 0 ? '₹'+(outstanding * r.price).toFixed(2) : '₹0';
  document.getElementById('sh-info').innerHTML = `
    <div class="info-row"><span style="color:#94A3B8">Delivered</span><span class="info-val">${r.picked} pkts</span></div>
    <div class="info-row"><span style="color:#94A3B8">Returned so far</span><span class="info-val">${r.returned} pkts</span></div>
    <div class="info-row"><span style="color:#94A3B8">Outstanding</span><span class="info-val" style="color:#FBBF24">${outstanding} pkts</span></div>
    <div class="info-row"><span style="color:#94A3B8">Price</span><span class="info-val">₹${r.price}/pkt</span></div>
  `;
  document.getElementById('settle-sheet').classList.add('open');
}

function closeSettle() { document.getElementById('settle-sheet').classList.remove('open'); settleTarget=null; }

function calcSheet() {
  if (!settleTarget) return;
  const sold = parseInt(document.getElementById('sh-sold').value)||0;
  document.getElementById('sh-due').textContent = '₹'+(sold*settleTarget.price).toFixed(2);
}

async function completeSettle() {
  if (!settleTarget) return;

  // Disable button to prevent double-tap
  const btn = document.querySelector('.btn-green-full');
  if (btn.disabled) return;
  btn.disabled = true;
  btn.textContent = '⏳ Saving...';

  try {
    const qty_sold = parseInt(document.getElementById('sh-sold').value)||0;
    const qty_returning = parseInt(document.getElementById('sh-returning').value)||0;
    const collected = parseFloat(document.getElementById('sh-collected').value)||0;
    const method = document.getElementById('sh-method').value;
    const amount_due = qty_sold * settleTarget.price;

    if (qty_sold + qty_returning > settleTarget.outstanding) {
      const ok = confirm(`Total (${qty_sold+qty_returning}) exceeds outstanding (${settleTarget.outstanding}). Proceed anyway?`);
      if (!ok) { btn.disabled=false; btn.textContent='✅ Settle & Generate Invoice'; return; }
    }

    // Duplicate check — same outlet, same date, same qty_sold
    const { data: existing } = await db.from('settlements')
      .select('id,invoice_id')
      .eq('outlet_id', settleTarget.id)
      .eq('rep_id', currentUser.id)
      .gte('settled_at', today+'T00:00:00')
      .lte('settled_at', today+'T23:59:59');

    if (existing && existing.length > 0) {
      const proceed = confirm(`A settlement for ${settleTarget.name} already exists today. Create another one?`);
      if (!proceed) { btn.disabled=false; btn.textContent='✅ Settle & Generate Invoice'; return; }
    }

    // Log return movement
    if (qty_returning > 0) {
      await db.from('stock_movements').insert({
        rep_id:currentUser.id, outlet_id:settleTarget.id, product_id:settleTarget.product_id,
        qty_packets:qty_returning, movement_type:'returned', date:today, notes:'settlement return'
      });
    }

    // Create settlement
    const { data: s, error: sErr } = await db.from('settlements').insert({
      rep_id:currentUser.id, outlet_id:settleTarget.id,
      qty_delivered:settleTarget.picked, qty_sold,
      qty_returned:settleTarget.returned+qty_returning,
      amount_due, amount_collected:collected, payment_method:method
    }).select().single();

    if (sErr) throw new Error(sErr.message);

    // Generate invoice with settlement_id as idempotency anchor
    const inv = 'AFF-'+today.replace(/-/g,'')+'-'+settleTarget.id.slice(0,4).toUpperCase();
    const { error: iErr } = await db.from('b2b_invoices').insert({
      invoice_number:inv, invoice_date:today, due_date:today,
      company_name:settleTarget.name, subtotal:amount_due, gst_total:0, grand_total:amount_due,
      items:[{name:settleTarget.product, qty:qty_sold, rate:settleTarget.price, amount:(qty_sold*settleTarget.price).toFixed(2)}],
      status:collected>=amount_due?'paid':'pending',
      settlement_id:s.id, outlet_id:settleTarget.id,
      rep_name:currentUser.name, created_by:currentUser.id,
      notes:`Sold:${qty_sold} Returned:${qty_returning} Collected:₹${collected}`
    });

    if (iErr) throw new Error('Invoice error: '+iErr.message);

    // Show success sheet
    closeSettle();
    const paid = collected >= amount_due;
    document.getElementById('ss-outlet').textContent = settleTarget.name + ' · ' + settleTarget.area;
    document.getElementById('ss-inv').textContent = inv;
    document.getElementById('ss-sold').textContent = qty_sold + ' pkts';
    document.getElementById('ss-amount').textContent = '₹' + amount_due.toFixed(2);
    document.getElementById('ss-collected').textContent = '₹' + collected.toFixed(2);
    document.getElementById('ss-status').textContent = paid ? '✅ Paid' : '⏳ Pending ₹'+(amount_due-collected).toFixed(2);
    document.getElementById('ss-status').style.color = paid ? '#4ADE80' : '#FBBF24';
    // Store for WhatsApp share
    window._lastInvoice = {inv, outletName:settleTarget.name, qty_sold, amount_due, collected, paid, product:settleTarget.product, price:settleTarget.price, rep:currentUser.name};
    document.getElementById('success-sheet').classList.add('open');
    await loadGrid();
  } catch(e) {
    alert('Error: '+e.message);
    btn.disabled=false;
    btn.textContent='✅ Settle & Generate Invoice';
  }
}

function shareWhatsApp() {
  const d = window._lastInvoice;
  if (!d) return;
  const date = new Date().toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
  const msg = `🧾 *Invoice from Absolute Fresh Food*

` +
    `Invoice No: *${d.inv}*
` +
    `Date: ${date}
` +
    `Store: ${d.outletName}

` +
    `Product: ${d.product}
` +
    `Qty: ${d.qty_sold} packets × ₹${d.price}
` +
    `*Total: ₹${d.amount_due.toFixed(2)}*
` +
    `Collected: ₹${d.collected.toFixed(2)}
` +
    (d.paid ? `Status: ✅ Paid
` : `Pending: ₹${(d.amount_due-d.collected).toFixed(2)}
`) +
    `
Thank you for your business!
_Absolute Fresh Food, Lucknow_
📞 83187 67689`;
  window.open('https://wa.me/?text='+encodeURIComponent(msg), '_blank');
}

function toast(msg) {
  const el=document.getElementById('toast');
  el.textContent=msg; el.style.display='block';
  setTimeout(()=>el.style.display='none',3000);
}

init();
</script>
