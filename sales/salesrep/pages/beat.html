<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-FL4T5WHM8W"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-FL4T5WHM8W');
  </script>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Beat — AFF</title>
  <link rel="stylesheet" href="../css/style.css"/>
  <link rel="manifest" href="../manifest.json"/>
  <meta name="theme-color" content="#1E293B"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <style>
    body{background:#0F172A}
    .top-bar{background:#1E293B;border-bottom:1px solid #334155;padding:10px 14px;
             display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:50}
    .chip{background:#0c2340;color:#60A5FA;border-radius:6px;padding:2px 8px;font-size:.72rem;font-weight:600}
    .icon-btn{background:#1E293B;border:1px solid #334155;color:#94A3B8;border-radius:6px;
              padding:5px 10px;font-size:.8rem;cursor:pointer;white-space:nowrap}
    .icon-btn:hover{border-color:#60A5FA;color:#60A5FA}
    .page-wrap{padding:10px 12px 80px}

    /* Stats row */
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
    .s-card{background:#1E293B;border:1px solid #334155;border-radius:8px;padding:8px;text-align:center}
    .s-lbl{font-size:.6rem;color:#94A3B8;text-transform:uppercase;letter-spacing:.04em}
    .s-val{font-size:1.1rem;font-weight:700;font-family:monospace}

    /* Toolbar */
    .toolbar{display:flex;align-items:center;gap:6px;margin-bottom:8px;flex-wrap:wrap}
    .toolbar input[type=date]{background:#1E293B;border:1px solid #334155;color:#F1F5F9;
      padding:6px 10px;border-radius:8px;font-size:.82rem;outline:none;font-family:inherit}

    /* Grid table */
    .grid-wrap{background:#1E293B;border:1px solid #334155;border-radius:12px;overflow:hidden}
    table{width:100%;border-collapse:collapse;font-size:.82rem}
    thead th{background:#0F172A;color:#64748B;font-size:.68rem;text-transform:uppercase;
             letter-spacing:.05em;padding:8px 10px;text-align:left;white-space:nowrap;
             border-bottom:1px solid #334155}
    tbody tr{border-bottom:1px solid #0F172A;cursor:pointer;transition:background .1s}
    tbody tr:last-child{border-bottom:none}
    tbody tr:hover{background:#0F172A}
    tbody tr.done-row td:first-child{border-left:3px solid #16A34A}
    tbody tr.pending-row td:first-child{border-left:3px solid #1D4ED8}
    td{padding:9px 10px;color:#CBD5E1;vertical-align:middle}
    td.bold{font-weight:600;color:#F1F5F9}
    td.mono{font-family:monospace;font-weight:600}
    .action-btns{display:flex;gap:4px}
    .act-btn{background:none;border:1px solid #334155;color:#94A3B8;border-radius:5px;
             padding:3px 8px;font-size:.72rem;cursor:pointer;white-space:nowrap}
    .act-btn:hover{border-color:#60A5FA;color:#60A5FA}
    .act-btn.green:hover{border-color:#16A34A;color:#4ADE80}
    .act-btn.red:hover{border-color:#991b1b;color:#F87171}

    /* Status pill */
    .pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:.68rem;font-weight:600}
    .pill-done{background:#052e16;color:#4ADE80}
    .pill-pending{background:#0c2340;color:#60A5FA}
    .pill-miss{background:#2d0a0a;color:#F87171}

    /* Modal */
    .overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;
             align-items:flex-end;z-index:100}
    .overlay.show{display:flex}
    .sheet{background:#1E293B;border-radius:20px 20px 0 0;padding:18px 18px 36px;
           width:100%;max-height:90vh;overflow-y:auto}
    .handle{width:32px;height:4px;background:#334155;border-radius:2px;margin:0 auto 14px}
    .sheet h3{font-size:.95rem;font-weight:600;color:#F1F5F9;margin-bottom:12px}
    .flbl{font-size:.7rem;color:#94A3B8;display:block;margin-bottom:4px;text-transform:uppercase}
    .finp{width:100%;background:#0F172A;border:1px solid #334155;color:#F1F5F9;
          border-radius:8px;padding:10px 12px;font-size:.9rem;font-family:inherit;outline:none}
    .finp:focus{border-color:#60A5FA}
    .kg-finp{font-size:1.6rem;font-family:monospace;font-weight:700;text-align:center}
    .inv-bar{background:#0F172A;border:1px solid #166534;border-radius:8px;padding:10px 14px;
             display:flex;justify-content:space-between;align-items:center;margin:10px 0}
    .inv-lbl{font-size:.72rem;color:#94A3B8}
    .inv-amt{font-size:1.3rem;font-weight:700;font-family:monospace;color:#4ADE80}
    .err{background:#2d0a0a;color:#F87171;border-radius:6px;padding:8px 10px;
         font-size:.8rem;margin-bottom:8px;display:none}
    .err.show{display:block}
    .m-actions{display:grid;grid-template-columns:1fr 2fr;gap:8px;margin-top:10px}
    .m-cancel{background:none;border:1px solid #334155;color:#94A3B8;border-radius:10px;
              padding:12px;font-size:.88rem;cursor:pointer}
    .m-submit{background:#16A34A;color:#fff;border:none;border-radius:10px;
              padding:12px;font-size:.88rem;font-weight:600;cursor:pointer}
    .m-submit:disabled{opacity:.4}
    .m-submit.blue{background:#1D4ED8}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
    .form-grp{margin-bottom:10px}
  </style>
</head>
<body>

<div class="top-bar">
  <img src="../../images/aff-logo.png" style="height:28px;width:auto"/>
  <div style="font-weight:600;color:#F1F5F9;font-size:.85rem;flex:1" id="greeting">Good morning</div>
  <button class="icon-btn" onclick="openAddOutlet()">🆕 Add Outlet</button>
  <button class="icon-btn" onclick="refreshBeat()">↻</button>
  <span class="chip" id="user-badge">Rep</span>
  <button class="icon-btn" onclick="signOut()" style="color:#F87171;border-color:#991b1b">Sign Out</button>
</div>

<div class="page-wrap">
  <!-- Stats -->
  <div class="stats">
    <div class="s-card"><div class="s-lbl">Outlets</div><div class="s-val" style="color:#60A5FA" id="s-total">—</div></div>
    <div class="s-card"><div class="s-lbl">Done</div><div class="s-val" style="color:#4ADE80" id="s-done">0</div></div>
    <div class="s-card"><div class="s-lbl">Pending</div><div class="s-val" style="color:#FBBF24" id="s-pending">—</div></div>
    <div class="s-card"><div class="s-lbl">Kg Today</div><div class="s-val" style="color:#4ADE80;font-size:.95rem" id="s-kg">0</div></div>
  </div>

  <!-- Toolbar -->
  <div class="toolbar">
    <button class="icon-btn" onclick="changeDate(-1)">‹</button>
    <input type="date" id="date-picker" onchange="loadDay()"/>
    <button class="icon-btn" onclick="changeDate(1)">›</button>
    <button class="icon-btn" onclick="openNewOrder()" style="margin-left:auto;background:#1D4ED8;border-color:#1D4ED8;color:#fff">
      + New Order
    </button>
  </div>

  <!-- Grid -->
  <div class="grid-wrap">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Outlet</th>
          <th>Area</th>
          <th>Target</th>
          <th>Product</th>
          <th>Kg</th>
          <th>Invoice</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="grid-body">
        <tr><td colspan="9" style="text-align:center;color:#94A3B8;padding:2rem">Loading...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Order modal -->
<div class="overlay" id="order-modal">
  <div class="sheet">
    <div class="handle"></div>
    <h3 id="modal-title">New Order</h3>
    <div id="modal-outlet" style="font-size:.8rem;color:#60A5FA;margin-bottom:12px"></div>
    <div id="order-err" class="err"></div>
    <div class="form-row">
      <div>
        <label class="flbl">Outlet</label>
        <select id="m-outlet" class="finp" id="m-outlet-sel"></select>
      </div>
      <div>
        <label class="flbl">Product</label>
        <select id="m-product" class="finp" onchange="calcInv()"></select>
      </div>
    </div>
    <div class="form-grp">
      <label class="flbl">Kg ordered</label>
      <input id="m-kg" type="number" class="finp kg-finp"
             placeholder="0" min="0.5" step="0.5" oninput="calcInv()"/>
    </div>
    <div class="inv-bar">
      <span class="inv-lbl">Invoice amount</span>
      <span class="inv-amt" id="m-inv">₹ —</span>
    </div>
    <div class="form-row">
      <div class="form-grp" style="margin:0">
        <label class="flbl">Delivery date</label>
        <select id="m-delivery-date" class="finp">
        </select>
      </div>
      <div class="form-grp" style="margin:0">
        <label class="flbl">Notes (optional)</label>
        <input id="m-notes" class="finp" placeholder="Special instructions..."/>
      </div>
    </div>
    <div class="m-actions">
      <button class="m-cancel" onclick="closeModal()">Cancel</button>
      <button class="m-submit" id="m-submit" onclick="submitOrder()">Submit Order →</button>
    </div>
  </div>
</div>

<!-- Add Outlet modal -->
<div class="overlay" id="outlet-modal">
  <div class="sheet">
    <div class="handle"></div>
    <h3>Add New Outlet</h3>
    <p style="font-size:.75rem;color:#94A3B8;margin-bottom:12px">Admin will review and activate it.</p>
    <div id="outlet-err" class="err"></div>
    <div class="form-row">
      <div class="form-grp" style="margin:0">
        <label class="flbl">Business name *</label>
        <input id="o-name" class="finp" placeholder="Hotel Saravana Bhavan"/>
      </div>
      <div class="form-grp" style="margin:0">
        <label class="flbl">Area *</label>
        <input id="o-area" class="finp" placeholder="Tambaram"/>
      </div>
    </div>
    <div class="form-row" style="margin-top:8px">
      <div class="form-grp" style="margin:0">
        <label class="flbl">Owner name</label>
        <input id="o-owner" class="finp" placeholder="Rajan"/>
      </div>
      <div class="form-grp" style="margin:0">
        <label class="flbl">Phone</label>
        <input id="o-phone" type="tel" class="finp" placeholder="9876543210"/>
      </div>
    </div>
    <div class="form-row" style="margin-top:8px">
      <div class="form-grp" style="margin:0;flex:1">
        <label class="flbl">Price Tier</label>
        <select id="o-tier" class="finp">
          <option value="4">T4 — Retail (default)</option>
          <option value="3">T3 — Supermarket</option>
          <option value="2">T2 — Mega Store</option>
          <option value="1">T1 — Enterprise / Chain</option>
        </select>
      </div>
    </div>
    <div class="m-actions" style="margin-top:14px">
      <button class="m-cancel" onclick="closeOutletModal()">Cancel</button>
      <button class="m-submit blue" id="o-submit" onclick="submitOutlet()">Submit</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/app.js"></script>
<script>
  let currentUser, products=[], myOutlets=[], rows=[], editOrderId=null;
  const todayStr = new Date().toISOString().split('T')[0];
  let viewDate = todayStr;

  const hour = new Date().getHours();
  document.getElementById('greeting').textContent =
    (hour<12?'Good morning':hour<17?'Good afternoon':'Good evening') + ' 👋';
  document.getElementById('date-picker').value = todayStr;
  document.getElementById('date-picker').max   = todayStr;

  (async()=>{
    currentUser = await getUser();
    if(!currentUser){location.href='../index.html';return;}
    if(currentUser.role==='admin'){location.href='dashboard.html';return;}
    if(currentUser.role==='driver'){location.href='deliveries.html';return;}
    document.getElementById('user-badge').textContent = currentUser.name.split(' ')[0];
    await Promise.all([loadProducts(), loadOutlets()]);
    await loadDay();
  })();

  let tierPrices = {}; // { product_id: { 1: price, 2: price, ... } }

  async function loadProducts(){
    const{data}=await db.from('products').select('*').eq('is_active',true).order('name');
    products=data||[];
    // Load tier prices for all products
    if (products.length) {
      const ids = products.map(p=>p.id);
      const{data:tp}=await db.from('product_prices').select('product_id,tier,price').in('product_id',ids);
      tierPrices={};
      (tp||[]).forEach(r=>{
        if(!tierPrices[r.product_id]) tierPrices[r.product_id]={};
        tierPrices[r.product_id][r.tier]=parseFloat(r.price);
      });
    }
    const opts = products.map(p=>`<option value="${p.id}">${p.name}</option>`).join('');
    document.getElementById('m-product').innerHTML = opts;
  }

  async function loadOutlets(){
    const{data}=await db.from('outlets').select('id,name,area,price_tier')
      .eq('rep_id',currentUser.id).eq('status','active').order('name');
    myOutlets=data||[];
    document.getElementById('m-outlet').innerHTML =
      myOutlets.map(o=>`<option value="${o.id}" data-tier="${o.price_tier||4}">${o.name} — ${o.area} (T${o.price_tier||4})</option>`).join('');
  }

  function getOutletTier(outletId) {
    const sel = document.getElementById('m-outlet');
    const opt = [...sel.options].find(o=>o.value===outletId);
    return parseInt(opt?.dataset.tier||4);
  }

  function changeDate(d){
    const dt=new Date(viewDate); dt.setDate(dt.getDate()+d);
    const nd=dt.toISOString().split('T')[0];
    if(nd<=todayStr){viewDate=nd;document.getElementById('date-picker').value=nd;loadDay();}
  }

  async function refreshBeat(){
    await db.from('daily_beat_logs').delete()
      .eq('rep_id',currentUser.id).eq('date',viewDate);
    loadDay();
  }

  async function loadDay(){
    viewDate=document.getElementById('date-picker').value;
    const tbody=document.getElementById('grid-body');
    tbody.innerHTML='<tr><td colspan="9" style="text-align:center;color:#94A3B8;padding:2rem">Loading...</td></tr>';

    const dayName=new Date(viewDate+'T12:00:00').toLocaleDateString('en-US',{weekday:'long'});
    const isToday=viewDate===todayStr;

    // Get beat logs
    let{data:logs}=await db.from('daily_beat_logs')
      .select('*,outlets(id,name,area,owner_name,phone)')
      .eq('rep_id',currentUser.id).eq('date',viewDate).order('visit_sequence');

    if(!logs?.length && isToday){
      const monthStart=viewDate.slice(0,7)+'-01';
      const{data:plan}=await db.from('monthly_beat_plans')
        .select('id').eq('rep_id',currentUser.id).eq('month',monthStart)
        .eq('status','published').maybeSingle();
      if(plan){
        const{data:items}=await db.from('monthly_beat_items')
          .select('*,outlets(id,name,area,owner_name,phone)')
          .eq('monthly_plan_id',plan.id).order('visit_sequence');
        if(items?.length){
          const toShow=items.filter(i=>{
            let d=i.preferred_days||[];
            if(typeof d==='string') d=d.replace(/[{}]/g,'').split(',').filter(Boolean);
            return d.length===0||d.includes(dayName);
          });
          const ins=(toShow.length?toShow:items).map(i=>({
            rep_id:currentUser.id,date:viewDate,outlet_id:i.outlet_id,
            visit_sequence:i.visit_sequence,target_kg:i.target_kg,status:'planned'
          }));
          await db.from('daily_beat_logs').upsert(ins,{onConflict:'rep_id,date,outlet_id'});
          const{data:nl}=await db.from('daily_beat_logs')
            .select('*,outlets(id,name,area,owner_name,phone)')
            .eq('rep_id',currentUser.id).eq('date',viewDate).order('visit_sequence');
          logs=nl;
        }
      }
      if(!logs?.length){
        logs=myOutlets.map((o,i)=>({
          id:null,outlet_id:o.id,outlets:o,visit_sequence:i+1,
          target_kg:0,status:'planned',order_id:null
        }));
      }
    }

    // Get orders for this day
    const outletIds=(logs||[]).map(l=>l.outlet_id);
    let ordersMap={};
    if(outletIds.length>0){
      const{data:orders}=await db.from('orders')
        .select('id,outlet_id,status').in('outlet_id',outletIds).eq('date',viewDate);
      const orderIds=(orders||[]).map(o=>o.id);
      if(orderIds.length>0){
        const{data:items}=await db.from('order_items')
          .select('id,order_id,kg_ordered,unit_price,discount_amount,products(name)')
          .in('order_id',orderIds);
        (orders||[]).forEach(o=>{
          ordersMap[o.outlet_id]={...o,items:(items||[]).filter(i=>i.order_id===o.id)};
        });
      }
    }

    renderGrid(logs||[],ordersMap);
  }

  function renderGrid(logs,ordersMap){
    const done=logs.filter(l=>ordersMap[l.outlet_id]).length;
    const pend=logs.filter(l=>!ordersMap[l.outlet_id]).length;
    const kg=Object.values(ordersMap).reduce((s,o)=>s+o.items.reduce((ss,i)=>ss+Number(i.kg_ordered),0),0);

    document.getElementById('s-total').textContent=logs.length;
    document.getElementById('s-done').textContent=done;
    document.getElementById('s-pending').textContent=pend;
    document.getElementById('s-kg').textContent=kg.toFixed(1);

    const tbody=document.getElementById('grid-body');
    if(!logs.length){
      tbody.innerHTML='<tr><td colspan="9" style="text-align:center;color:#94A3B8;padding:2rem">No outlets for this date</td></tr>';
      return;
    }

    tbody.innerHTML=logs.map(log=>{
      const o=log.outlets||{};
      const ord=ordersMap[log.outlet_id];
      const isDone=!!ord;
      const rowKg=ord?ord.items.reduce((s,i)=>s+Number(i.kg_ordered),0):0;
      const inv=ord?ord.items.reduce((s,i)=>s+(Number(i.kg_ordered)*Number(i.unit_price))-Number(i.discount_amount||0),0):0;
      const prodName=ord?ord.items.map(i=>i.products?.name||'—').join(', '):'—';
      const statusPill=isDone
        ?'<span class="pill pill-done">Done</span>'
        :'<span class="pill pill-pending">Pending</span>';
      const safePhone=(o.phone||'').replace(/'/g,'');
      const safeArea=(o.area||'').replace(/'/g,'');
      const actions=isDone
        ?`<div class="action-btns">
            <button class="act-btn green" onclick="editOrder('${ord.id}','${log.outlet_id}','${(o.name||'').replace(/'/g,'')}')">Edit</button>
            <button class="act-btn" style="border-color:#7C3AED;color:#A78BFA" onclick="openInvModal('${log.outlet_id}','${(o.name||'').replace(/'/g,'')}','${safeArea}','${safePhone}')">🧾 Invoice</button>
          </div>`
        :`<div class="action-btns">
            <button class="act-btn" onclick="placeOrder('${log.outlet_id}','${(o.name||'').replace(/'/g,'')}')">Order</button>
            <button class="act-btn" style="border-color:#7C3AED;color:#A78BFA" onclick="openInvModal('${log.outlet_id}','${(o.name||'').replace(/'/g,'')}','${safeArea}','${safePhone}')">🧾 Invoice</button>
          </div>`;

      return`<tr class="${isDone?'done-row':'pending-row'}">
        <td>${log.visit_sequence}</td>
        <td class="bold">${o.name||'—'}</td>
        <td style="color:#94A3B8">${o.area||'—'}</td>
        <td class="mono" style="color:#64748B">${log.target_kg||0}</td>
        <td style="color:#94A3B8;font-size:.78rem">${prodName}</td>
        <td class="mono">${rowKg>0?rowKg.toFixed(1):'—'}</td>
        <td class="mono" style="color:#4ADE80">${inv>0?fmt.inr(inv):'—'}</td>
        <td>${statusPill}</td>
        <td>${actions}</td>
      </tr>`;
    }).join('');
  }

  // ── Order modal ────────────────────────────────────────────
  function placeOrder(outletId, outletName){
    editOrderId=null;
    document.getElementById('modal-title').textContent='New Order';
    document.getElementById('modal-outlet').textContent=outletName;
    document.getElementById('m-outlet').value=outletId;
    document.getElementById('m-kg').value='';
    document.getElementById('m-notes').value='';
    document.getElementById('m-inv').textContent='₹ —';
    document.getElementById('order-err').classList.remove('show');
    document.getElementById('m-submit').textContent='Submit Order →';
    document.getElementById('m-submit').className='m-submit';
    // Populate delivery dates - today + next 3 days
    const dsel = document.getElementById('m-delivery-date');
    dsel.innerHTML = '';
    for(let i=0;i<=3;i++){
      const d = new Date(); d.setDate(d.getDate()+i);
      const val = d.toISOString().split('T')[0];
      const lbl = i===0?'Today':i===1?'Tomorrow':d.toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'});
      const opt = document.createElement('option');
      opt.value=val; opt.textContent=lbl; if(i===1) opt.selected=true;
      dsel.appendChild(opt);
    }
    document.getElementById('order-modal').classList.add('show');
  }

  function openNewOrder(){
    placeOrder(myOutlets[0]?.id||'', myOutlets[0]?.name||'Select outlet');
  }

  function editOrder(orderId, outletId, outletName){
    editOrderId=orderId;
    document.getElementById('modal-title').textContent='Edit Order';
    document.getElementById('modal-outlet').textContent=outletName;
    document.getElementById('m-outlet').value=outletId;
    document.getElementById('m-kg').value='';
    document.getElementById('m-notes').value='';
    document.getElementById('m-inv').textContent='₹ —';
    document.getElementById('order-err').classList.remove('show');
    document.getElementById('m-submit').textContent='Save Changes';
    document.getElementById('m-submit').className='m-submit blue';
    document.getElementById('order-modal').classList.add('show');
  }

  function closeModal(){ document.getElementById('order-modal').classList.remove('show'); }

  function calcInv(){
    const sel=document.getElementById('m-product');
    const productId=sel.value;
    const kg=parseFloat(document.getElementById('m-kg').value)||0;
    const outletId=document.getElementById('m-outlet').value;
    const tier=getOutletTier(outletId);
    const price=(tierPrices[productId]&&tierPrices[productId][tier])||0;
    // Show tier label in invoice line
    const TIER_NAMES=['','Enterprise','Mega','Super','Retail'];
    document.getElementById('m-inv').textContent=kg>0?`${fmt.inr(kg*price)} @ ₹${price}/${TIER_NAMES[tier]}`:'₹ —';
  }

  async function submitOrder(){
    const outletId=document.getElementById('m-outlet').value;
    const sel=document.getElementById('m-product');
    const kg=parseFloat(document.getElementById('m-kg').value);
    const notes=document.getElementById('m-notes').value;
    const btn=document.getElementById('m-submit');
    const err=document.getElementById('order-err');

    if(!outletId||!sel.value||!kg||kg<0.5){
      err.textContent='Select outlet, product and enter kg (min 0.5)';
      err.classList.add('show');return;
    }
    if(kg>500){err.textContent='Max 500 kg per order';err.classList.add('show');return;}

    const price=parseFloat(sel.selectedOptions[0]?.dataset.price)||0;
    btn.disabled=true;btn.textContent='Saving...';err.classList.remove('show');

    if(editOrderId){
      // Update existing order items
      await db.from('order_items').delete().eq('order_id',editOrderId);
      await db.from('order_items').insert({
        order_id:editOrderId,product_id:sel.value,
        kg_ordered:kg,unit_price:price,discount_amount:0
      });
      await db.from('orders').update({notes}).eq('id',editOrderId);
      showToast('Order updated');
    } else {
      const dsel = document.getElementById('m-delivery-date');
      const tomorrow = new Date(); tomorrow.setDate(tomorrow.getDate()+1);
      const tomorrowStr = tomorrow.toISOString().split('T')[0];
      const deliveryDate = dsel?.value || tomorrowStr;
      const{data:order,error:oErr}=await db.from('orders').insert({
        outlet_id:outletId,rep_id:currentUser.id,
        date:viewDate,delivery_date:deliveryDate,status:'pending',notes
      }).select().single();
      if(oErr){
        err.textContent=oErr.message.includes('unique')?'Order already exists for this outlet today':oErr.message;
        err.classList.add('show');btn.disabled=false;btn.textContent='Submit Order →';return;
      }
      await db.from('order_items').insert({
        order_id:order.id,product_id:sel.value,
        kg_ordered:kg,unit_price:price,discount_amount:0
      });
      await db.from('daily_beat_logs')
        .update({status:'completed',order_id:order.id,visited_at:new Date().toISOString()})
        .eq('rep_id',currentUser.id).eq('date',viewDate).eq('outlet_id',outletId);
      showToast(kg+' kg submitted');
    }

    closeModal();
    btn.disabled=false;
    await loadDay();
  }

  // ── Add Outlet modal ───────────────────────────────────────
  function openAddOutlet(){
    ['o-name','o-area','o-owner','o-phone'].forEach(id=>document.getElementById(id).value='');
    document.getElementById('o-tier').value='4';
    document.getElementById('outlet-err').classList.remove('show');
    document.getElementById('outlet-modal').classList.add('show');
  }
  function closeOutletModal(){ document.getElementById('outlet-modal').classList.remove('show'); }
  async function submitOutlet(){
    const name=document.getElementById('o-name').value.trim();
    const area=document.getElementById('o-area').value.trim();
    const tier=parseInt(document.getElementById('o-tier').value)||4;
    const err=document.getElementById('outlet-err');
    const btn=document.getElementById('o-submit');
    if(!name||!area){err.textContent='Name and area required';err.classList.add('show');return;}
    btn.disabled=true;btn.textContent='Saving...';
    await db.from('outlets').insert({
      name,area,
      owner_name:document.getElementById('o-owner').value.trim()||null,
      phone:document.getElementById('o-phone').value.trim()||null,
      rep_id:currentUser.id,
      status:'active',
      price_tier:tier
    });
    closeOutletModal();
    showToast('Outlet added ✅');
    btn.disabled=false;btn.textContent='Submit';
    await loadOutlets();
  }


  // ── Beat Invoice ──────────────────────────────────────────
  let beatInvProducts = [];
  let beatInvOutlet = {};

  async function loadBeatInvProducts(){
    if(beatInvProducts.length) return;
    const{data}=await db.from('products').select('name,mrp').eq('is_active',true).order('name');
    beatInvProducts = (data||[]).map(p=>({id:p.id, name:p.name, hsn:'10063090', mrp:parseFloat(p.mrp)||0, gst:5}));
    beatInvProducts.push({id:null, name:'Custom Item', hsn:'', mrp:0, gst:5});
  }

  async function openInvModal(outletId, outletName, area, phone){
    await loadBeatInvProducts();
    const outletData = myOutlets.find(o=>o.id===outletId);
    const tier = outletData?.price_tier || 4;
    beatInvOutlet = {id:outletId, name:outletName, area, phone, tier};
    document.getElementById('inv-outlet-name').textContent = outletName + (area?' — '+area:'');
    document.getElementById('bi-phone').value = phone||'';
    document.getElementById('bi-addr').value = area||'';
    document.getElementById('bi-gstin').value = '';
    document.getElementById('bi-items').innerHTML = '';
    addBiRow();
    calcBiTotals();
    document.getElementById('bi-submit').disabled = false;
    document.getElementById('bi-submit').textContent = '✅ Submit Invoice';
    document.getElementById('bi-submit').style.background = '#7C3AED';
    document.getElementById('inv-modal').classList.add('show');
  }
  function closeInvModal(){ document.getElementById('inv-modal').classList.remove('show'); }

  function addBiRow(){
    const opts = beatInvProducts.map((p,i)=>`<option value="${i}">${p.name}</option>`).join('');
    const tier = beatInvOutlet.tier || 4;
    const row = document.createElement('div');
    row.style.cssText = 'display:grid;grid-template-columns:2fr 60px 80px 80px auto;gap:6px;margin-bottom:8px;align-items:center';
    row.innerHTML = `
      <select class="finp bi-prod" style="font-size:.78rem;padding:6px" onchange="fillBiRow(this)">
        <option value="">— Product —</option>${opts}
      </select>
      <select class="finp bi-tier" style="font-size:.75rem;padding:6px" onchange="fillBiRow(this.closest('div').querySelector('.bi-prod'))">
        <option value="1"${tier==1?' selected':''}>T1</option>
        <option value="2"${tier==2?' selected':''}>T2</option>
        <option value="3"${tier==3?' selected':''}>T3</option>
        <option value="4"${tier==4?' selected':''}>T4</option>
      </select>
      <input type="number" class="finp bi-qty" placeholder="Qty" min="1" value="1" style="font-size:.82rem;padding:6px;text-align:center" oninput="calcBiTotals()"/>
      <input type="number" class="finp bi-rate" placeholder="Rate" style="font-size:.82rem;padding:6px;text-align:right;color:#FBBF24" oninput="calcBiTotals()" readonly/>
      <button onclick="this.parentElement.remove();calcBiTotals()" style="background:none;border:1px solid #991b1b;color:#F87171;border-radius:5px;padding:4px 8px;cursor:pointer;font-size:.8rem">✕</button>
    `;
    document.getElementById('bi-items').appendChild(row);
  }

  function fillBiRow(prodSel){
    const row = prodSel.closest('div');
    const idx = parseInt(prodSel.value);
    const p = beatInvProducts[idx];
    const tierSel = row.querySelector('.bi-tier');
    const t = parseInt(tierSel?.value||4);
    if(!p || idx==='') return;
    // Get tier price from tierPrices map, fall back to MRP
    const tPrice = (p.id && tierPrices[p.id] && tierPrices[p.id][t]) ? tierPrices[p.id][t] : p.mrp;
    row.querySelector('.bi-rate').value = tPrice.toFixed(2);
    calcBiTotals();
  }

  function calcBiTotals(){
    let sub=0, gstAmt=0;
    document.querySelectorAll('#bi-items > div').forEach(row=>{
      const idx = parseInt(row.querySelector('.bi-prod').value);
      const p = beatInvProducts[idx];
      if(!p) return;
      const qty = parseFloat(row.querySelector('.bi-qty').value)||0;
      const rate = parseFloat(row.querySelector('.bi-rate')?.value)||0;
      const base = qty * rate;
      const tax = base * p.gst/100;
      sub += base; gstAmt += tax;
    });
    document.getElementById('bi-subtotal').textContent = '₹'+sub.toFixed(2);
    document.getElementById('bi-gst').textContent = '₹'+gstAmt.toFixed(2);
    document.getElementById('bi-grand').textContent = '₹'+(sub+gstAmt).toFixed(2);
  }

  async function submitBeatInv(){
    const btn = document.getElementById('bi-submit');
    if(btn.disabled) return;
    const rows = [...document.querySelectorAll('#bi-items > div')];
    const items = rows.map(row=>{
      const idx = parseInt(row.querySelector('.bi-prod').value);
      const p = beatInvProducts[idx];
      if(!p) return null;
      const qty = parseFloat(row.querySelector('.bi-qty').value)||0;
      const rate = parseFloat(row.querySelector('.bi-rate')?.value)||0;
      const disc = p.mrp>0 ? Math.round((1 - rate/p.mrp)*100*10)/10 : 0;
      return {name:p.name, hsn:p.hsn, qty, mrp:p.mrp, rate, disc, gst:p.gst};
    }).filter(Boolean);
    if(!items.length){ alert('Add at least one product.'); return; }

    btn.disabled=true; btn.textContent='Saving…'; btn.style.background='#475569';

    const today = new Date().toISOString().split('T')[0];
    const dd = today.slice(2,4)+today.slice(5,7);
    const invNum = 'AFF-'+dd+'-'+Math.floor(100+Math.random()*900);
    let sub=0, gstAmt=0, itemRows='';
    items.forEach(it=>{
      const base = it.qty * it.mrp * (1-it.disc/100);
      const tax = base * it.gst/100;
      sub+=base; gstAmt+=tax;
      const discCell = it.disc>0?`<span style="color:#f59e0b;font-size:10px"> -${it.disc}%</span>`:'';
      itemRows+=`<tr><td>${it.name}</td><td>${it.hsn}</td><td style="text-align:center">${it.qty}</td><td style="text-align:right">₹${it.mrp.toFixed(2)}${discCell}</td><td style="text-align:center">${it.gst}%</td><td style="text-align:right">₹${tax.toFixed(2)}</td><td style="text-align:right">₹${(base+tax).toFixed(2)}</td></tr>`;
    });
    const grand = sub+gstAmt;
    const phone = document.getElementById('bi-phone').value.trim();
    const addr = document.getElementById('bi-addr').value.trim();
    const gstin = document.getElementById('bi-gstin').value.trim();

    // Save to DB
    await db.from('b2b_invoices').insert({
      invoice_number:invNum, invoice_date:today, due_date:today,
      company_name:beatInvOutlet.name, company_address:addr,
      company_phone:phone, company_gstin:gstin||null,
      subtotal:sub, gst_total:gstAmt, grand_total:grand,
      items, our_gstin:'09TULPS3880J1ZB',
      status:'sent', rep_name:currentUser.name,
      created_by:currentUser.id
    });

    // Open print window
    const AFF_LOGO = 'https://sales.absolutefreshfood.com/images/aff-logo.png';
    const invHtml = `<!DOCTYPE html><html><head><meta charset="UTF-8"/>
    <style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Arial,sans-serif;font-size:13px;color:#1a1a1a;padding:40px;max-width:800px;margin:0 auto}.header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:32px;padding-bottom:20px;border-bottom:3px solid #CC0000}.inv-title{font-size:28px;font-weight:900;color:#CC0000;letter-spacing:2px}.parties{display:grid;grid-template-columns:1fr 1fr;gap:32px;margin-bottom:28px}.party-box h4{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:#999;margin-bottom:8px}.party-box strong{font-size:15px;color:#CC0000}table{width:100%;border-collapse:collapse;margin-bottom:20px}thead tr{background:#CC0000;color:#fff}thead th{padding:10px 12px;text-align:left;font-size:11px}tbody tr:nth-child(even){background:#fff5f5}tbody td{padding:9px 12px;border-bottom:1px solid #eee;font-size:12px}.totals{margin-left:auto;width:260px}.totals td{padding:6px 12px;font-size:13px}.totals tr.grand td{background:#CC0000;color:#fff;font-weight:700;font-size:15px;padding:10px 12px}.terms{margin-top:24px;font-size:11px;color:#666;background:#fff5f5;padding:12px;border-radius:4px;border-left:3px solid #CC0000}.footer{margin-top:28px;padding-top:12px;border-top:1px solid #ddd;display:flex;justify-content:space-between;font-size:11px;color:#999}@media print{button{display:none!important}}</style></head><body>
    <div class="header">
      <div><img src="${AFF_LOGO}" style="height:50px;margin-bottom:6px"/><br/><span style="font-size:11px;color:#666">Stone-Ground Daily · Lucknow, UP<br/>+91 83187 67689 | GSTIN: 09TULPS3880J1ZB<br/>FSSAI: 12724055000349</span></div>
      <div style="text-align:right"><div class="inv-title">INVOICE</div><div style="font-size:12px;color:#666;margin-top:6px"># ${invNum}<br/>Date: ${today}</div></div>
    </div>
    <div class="parties">
      <div class="party-box"><h4>Bill To</h4><strong>${beatInvOutlet.name}</strong><br/><span style="font-size:12px;color:#555">${addr}${gstin?'<br/>GSTIN: '+gstin:''}${phone?'<br/>+91 '+phone:''}</span></div>
      <div class="party-box"><h4>Sales Rep</h4><span style="font-size:12px;color:#555">${currentUser.name}</span></div>
    </div>
    <table><thead><tr><th>Description</th><th>HSN</th><th style="text-align:center">Qty</th><th style="text-align:right">Rate</th><th style="text-align:center">GST</th><th style="text-align:right">Tax</th><th style="text-align:right">Total</th></tr></thead><tbody>${itemRows}</tbody></table>
    <div class="totals"><table><tr><td>Subtotal</td><td style="text-align:right">₹${sub.toFixed(2)}</td></tr><tr><td>GST</td><td style="text-align:right">₹${gstAmt.toFixed(2)}</td></tr><tr class="grand"><td>Grand Total</td><td style="text-align:right">₹${grand.toFixed(2)}</td></tr></table></div>
    <div class="terms"><strong>Terms:</strong> Payment due on delivery. All disputes to be discussed with Absolute Fresh and liability is limited to the total invoice value.</div>
    <div class="footer"><span>Thank you for your business!</span><span>Absolute Fresh Food · absolutefreshfood.com</span></div>
    <div style="margin-top:16px;text-align:center;font-size:10px;color:#aaa;border-top:1px dashed #ddd;padding-top:10px">🖥️ System-generated invoice. No signature required.</div>
    <div style="text-align:center;padding:20px"><button onclick="window.print()" style="background:#CC0000;color:#fff;border:none;padding:12px 36px;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer">⬇ Save as PDF</button></div>
    </body></html>`;

    const win = window.open('','_blank');
    if(win){ win.document.write(invHtml); win.document.close(); }
    closeInvModal();
    showToast('Invoice '+invNum+' submitted ✅');
  }

  document.getElementById('inv-modal').addEventListener('click',e=>{
    if(e.target===document.getElementById('inv-modal')) closeInvModal();
  });

  // Close modals on backdrop tap
  ['order-modal','outlet-modal'].forEach(id=>{
    document.getElementById(id).addEventListener('click',e=>{
      if(e.target===document.getElementById(id)) document.getElementById(id).classList.remove('show');
    });
  });
</script>

<!-- Invoice modal -->
<div class="overlay" id="inv-modal">
  <div class="sheet" style="max-height:95vh">
    <div class="handle"></div>
    <h3>🧾 Create Invoice</h3>
    <div id="inv-outlet-name" style="font-size:.8rem;color:#A78BFA;margin-bottom:10px"></div>
    <div class="form-row">
      <div class="form-grp" style="margin:0">
        <label class="flbl">GSTIN (buyer)</label>
        <input id="bi-gstin" class="finp" placeholder="09XXXXX (optional)"/>
      </div>
      <div class="form-grp" style="margin:0">
        <label class="flbl">Phone</label>
        <input id="bi-phone" class="finp" placeholder="10-digit"/>
      </div>
    </div>
    <div class="form-grp" style="margin-top:8px">
      <label class="flbl">Address</label>
      <input id="bi-addr" class="finp" placeholder="Full address"/>
    </div>
    <div style="margin:10px 0 6px;font-size:.7rem;color:#94A3B8;text-transform:uppercase;letter-spacing:.05em">Line Items</div>
    <div id="bi-items"></div>
    <button onclick="addBiRow()" style="width:100%;background:none;border:1px dashed #334155;color:#64748B;border-radius:8px;padding:8px;font-size:.8rem;cursor:pointer;margin-bottom:10px">+ Add Item</button>
    <div style="background:#0F172A;border-radius:8px;padding:10px 14px;margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;font-size:.82rem;color:#94A3B8;margin-bottom:4px"><span>Subtotal</span><span id="bi-subtotal">₹0</span></div>
      <div style="display:flex;justify-content:space-between;font-size:.82rem;color:#94A3B8;margin-bottom:4px"><span>GST</span><span id="bi-gst">₹0</span></div>
      <div style="display:flex;justify-content:space-between;font-size:1rem;font-weight:700;color:#4ADE80"><span>Grand Total</span><span id="bi-grand">₹0</span></div>
    </div>
    <div class="m-actions">
      <button class="m-cancel" onclick="closeInvModal()">Cancel</button>
      <button class="m-submit" style="background:#7C3AED" id="bi-submit" onclick="submitBeatInv()">✅ Submit Invoice</button>
    </div>
  </div>
</div>

</body>
</html>
