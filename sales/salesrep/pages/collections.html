<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Collections — AFF</title>
  <link rel="stylesheet" href="../css/style.css"/>
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/jquery.dataTables.min.css"/>
  <style>
    .dataTables_wrapper{color:var(--text)}
    .dataTables_wrapper .dataTables_length select,.dataTables_wrapper .dataTables_filter input{background:#0F172A;border:1px solid var(--border);color:var(--text);border-radius:6px;padding:4px 8px}
    .dataTables_wrapper .dataTables_info,.dataTables_wrapper .dataTables_paginate{color:var(--muted);font-size:.82rem}
    .dataTables_wrapper .dataTables_paginate .paginate_button{color:var(--muted)!important;border-radius:6px!important}
    .dataTables_wrapper .dataTables_paginate .paginate_button.current,.dataTables_wrapper .dataTables_paginate .paginate_button:hover{background:var(--blue-bg)!important;color:var(--blue)!important;border:1px solid var(--blue)!important}
    table.dataTable thead th{background:#1E293B;color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--border)!important}
    table.dataTable tbody tr{background:var(--bg)!important}
    table.dataTable tbody tr:hover td{background:#1E293B!important}
    table.dataTable tbody td{border-bottom:1px solid #1E293B!important;color:#CBD5E1;vertical-align:middle;padding:.6rem .75rem}
    .summary-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:.75rem;margin-bottom:1rem}
    .sum-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:.75rem 1rem}
    .sum-label{font-size:.72rem;color:var(--muted);margin-bottom:4px}
    .sum-val{font-size:1.3rem;font-weight:700;font-family:monospace}
    .action-bar{display:flex;gap:8px;align-items:center;margin-bottom:1rem;flex-wrap:wrap}
    .action-bar select,.action-bar input[type=date]{background:#0F172A;border:1px solid var(--border);color:var(--text);border-radius:6px;padding:7px 10px;font-size:.85rem}
  </style>
</head>
<body>
<div class="admin-shell">
  <aside class="sidebar">
    <div class="sidebar-brand"><span class="brand-icon">🥬</span><span class="brand-name">AFF Sales</span></div>
    <nav class="sidebar-nav">
      <a class="nav-link" href="dashboard.html">📊 Dashboard</a>
      <a class="nav-link" href="beatplan.html">📋 Beat Plans</a>
      <a class="nav-link" href="outlets.html">🏪 Outlets</a>
      <a class="nav-link" href="orders.html">📦 Orders</a>
      <a class="nav-link" href="deliveries-admin.html">🚚 Deliveries</a>
      <a class="nav-link active" href="collections.html">💰 Collections</a>
      <a class="nav-link" href="analytics.html">📈 Analytics</a>
      <a class="nav-link" href="sales-intel.html">🎯 Sales Intel</a>
      <a class="nav-link" href="ledger.html">📒 Ledger</a>
      <a class="nav-link" href="team.html">👥 Team</a>
      <a class="nav-link" href="settings.html">⚙️ Settings</a>
    </nav>
    <div class="sidebar-footer"><button class="btn btn-ghost btn-sm btn-full" onclick="signOut()">Sign Out</button></div>
  </aside>
  <main class="admin-main">
    <div class="topbar"><strong>Collections</strong></div>
    <div class="content">
      <div class="summary-bar">
        <div class="sum-card"><div class="sum-label">Total Invoiced</div><div class="sum-val blue" id="s-inv">—</div></div>
        <div class="sum-card"><div class="sum-label">Total Collected</div><div class="sum-val green" id="s-col">—</div></div>
        <div class="sum-card"><div class="sum-label">Outstanding</div><div class="sum-val red" id="s-out">—</div></div>
        <div class="sum-card"><div class="sum-label">Credit Accounts</div><div class="sum-val amber" id="s-cred">—</div></div>
      </div>
      <div class="action-bar">
        <input type="date" id="f-from"/>
        <input type="date" id="f-to"/>
        <select id="f-rep"><option value="">All Reps</option></select>
        <select id="f-payment">
          <option value="">All Payments</option>
          <option value="cash">Cash</option>
          <option value="upi">UPI</option>
          <option value="credit">Credit</option>
          <option value="cheque">Cheque</option>
        </select>
        <button class="btn btn-primary btn-sm" onclick="loadCollections()">Apply</button>
        <button class="btn btn-ghost btn-sm" onclick="resetFilters()">Reset</button>
        <button class="btn btn-ghost btn-sm" style="margin-left:auto" onclick="exportCSV()">⬇ Export CSV</button>
      </div>
      <div class="table-wrap">
        <table id="col-grid" style="width:100%">
          <thead><tr>
            <th>Date</th><th>Outlet</th><th>Area</th><th>Rep</th>
            <th>Invoiced ₹</th><th>Collected ₹</th><th>Outstanding ₹</th>
            <th>Payment</th><th>Status</th>
          </tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </main>
</div>
<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/app.js"></script>
<script>
  let dt;
  const today = new Date().toISOString().split('T')[0];
  const monthStart = today.slice(0,7)+'-01';
  document.getElementById('f-from').value = monthStart;
  document.getElementById('f-to').value   = today;

  (async () => {
    const user = await getUser();
    if (!user || user.role !== 'admin') { location.href='dashboard.html'; return; }
    const { data: reps } = await db.from('users').select('id,name').eq('role','rep').eq('is_active',true);
    const sel = document.getElementById('f-rep');
    sel.innerHTML = '<option value="">All Reps</option>' +
      (reps||[]).map(r=>`<option value="${r.id}">${r.name}</option>`).join('');
    initTable();
    await loadCollections();
  })();

  function initTable() {
    dt = $('#col-grid').DataTable({
      data:[], columns:[
        {title:'Date',data:'date'},
        {title:'Outlet',data:'outlet_name',className:'td-bold'},
        {title:'Area',data:'outlet_area'},
        {title:'Rep',data:'rep_name'},
        {title:'Invoiced ₹',data:'invoiced',render:v=>`<span style="font-family:monospace">₹${Number(v).toLocaleString('en-IN')}</span>`},
        {title:'Collected ₹',data:'collected',render:v=>`<span style="font-family:monospace;font-weight:600;color:var(--green)">₹${Number(v).toLocaleString('en-IN')}</span>`},
        {title:'Outstanding ₹',data:'outstanding',render:v=>{
          const cls = v>0 ? 'style="font-family:monospace;font-weight:600;color:var(--red)"' : 'style="font-family:monospace;color:var(--green)"';
          return `<span ${cls}>₹${Number(v).toLocaleString('en-IN')}</span>`}},
        {title:'Payment',data:'payment_mode',render:v=>v?`<span class="badge badge-blue">${v}</span>`:'<span style="color:var(--muted)">—</span>'},
        {title:'Status',data:'status',render:(s,_,row)=>{
          if (!row.delivered) return '<span class="badge badge-amber">Pending delivery</span>';
          if (row.outstanding>0) return '<span class="badge badge-red">Outstanding</span>';
          return '<span class="badge badge-green">Cleared</span>';}}
      ],
      pageLength:50, order:[[0,'desc']],
      language:{emptyTable:'No collection records found.'},
      dom:'<"top"lf>rt<"bottom"ip>'
    });
  }

  async function loadCollections() {
    const from    = document.getElementById('f-from').value;
    const to      = document.getElementById('f-to').value;
    const repId   = document.getElementById('f-rep').value;
    const payment = document.getElementById('f-payment').value;

    // Get orders with deliveries
    let q = db.from('orders')
      .select('id,date,status,rep_id,outlets(name,area),users(name),order_items(kg_ordered,unit_price,discount_amount),deliveries(id,cash_collected,payment_mode)')
      .order('date',{ascending:false});
    if (from) q = q.gte('date',from);
    if (to)   q = q.lte('date',to);
    if (repId) q = q.eq('rep_id',repId);

    const { data, error } = await q;
    if (error) { console.error(error); return; }

    const rows = [];
    let totalInv=0, totalCol=0, creditCount=0;

    (data||[]).forEach(o => {
      const invoiced  = (o.order_items||[]).reduce((s,i)=>s+(Number(i.kg_ordered)*Number(i.unit_price))-Number(i.discount_amount),0);
      const delivery  = o.deliveries?.[0];
      const collected = delivery ? Number(delivery.cash_collected) : 0;
      const outstanding = invoiced - collected;
      const payMode   = delivery?.payment_mode || '';

      if (payment && payMode !== payment) return;

      totalInv += invoiced;
      totalCol += collected;
      if (payMode === 'credit') creditCount++;

      rows.push({
        date:         o.date,
        outlet_name:  o.outlets?.name||'—',
        outlet_area:  o.outlets?.area||'—',
        rep_name:     o.users?.name||'—',
        invoiced,
        collected,
        outstanding,
        payment_mode: payMode,
        delivered:    !!delivery,
        status:       o.status
      });
    });

    dt.clear().rows.add(rows).draw();
    document.getElementById('s-inv').textContent  = fmt.inr(totalInv);
    document.getElementById('s-col').textContent  = fmt.inr(totalCol);
    document.getElementById('s-out').textContent  = fmt.inr(totalInv-totalCol);
    document.getElementById('s-cred').textContent = creditCount;
  }

  function resetFilters() {
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('f-from').value    = today.slice(0,7)+'-01';
    document.getElementById('f-to').value      = today;
    document.getElementById('f-rep').value     = '';
    document.getElementById('f-payment').value = '';
    loadCollections();
  }

  function exportCSV() {
    const rows = dt.rows({search:'applied'}).data().toArray();
    const hdr  = ['Date','Outlet','Area','Rep','Invoiced','Collected','Outstanding','Payment','Status'];
    const csv  = [hdr.join(','), ...rows.map(r=>[r.date,`"${r.outlet_name}"`,`"${r.outlet_area}"`,`"${r.rep_name}"`,r.invoiced,r.collected,r.outstanding,r.payment_mode,r.status].join(','))].join('\n');
    const a = document.createElement('a');
    a.href = 'data:text/csv;charset=utf-8,'+encodeURIComponent(csv);
    a.download = `collections_${document.getElementById('f-from').value}.csv`;
    a.click();
  }
</script>
</body>
</html>
