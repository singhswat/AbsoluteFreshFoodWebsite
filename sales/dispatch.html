<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dispatch — Absolute Fresh</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0fdf4;color:#1f2937;min-height:100vh}

    /* PIN */
    #pin-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:linear-gradient(160deg,#052e16,#14532d)}
    .pin-logo{font-size:2.8rem;margin-bottom:6px}
    .pin-brand{font-size:1.1rem;font-weight:800;color:#fff;margin-bottom:4px}
    .pin-sub{font-size:.78rem;color:#86efac;margin-bottom:28px}
    .pin-box{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);border-radius:16px;padding:24px 20px;width:100%;max-width:300px}
    .pin-label{font-size:.7rem;font-weight:700;color:#86efac;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
    .pin-input{width:100%;background:rgba(0,0,0,.3);border:1.5px solid rgba(255,255,255,.2);color:#fff;border-radius:10px;padding:14px;font-size:1.4rem;letter-spacing:.3em;text-align:center;outline:none;font-family:monospace}
    .pin-input:focus{border-color:#4ade80}
    .pin-err{color:#fca5a5;font-size:.78rem;text-align:center;margin-top:8px;min-height:18px}
    .pin-btn{width:100%;background:#16a34a;color:#fff;border:none;border-radius:10px;padding:14px;font-size:.95rem;font-weight:700;cursor:pointer;margin-top:14px}

    /* App */
    #app{display:none}
    .top-bar{background:#16a34a;padding:11px 14px;display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:40;box-shadow:0 2px 8px rgba(0,0,0,.15)}
    .top-bar-title{font-weight:800;color:#fff;font-size:.95rem;flex:1}
    .top-bar-meta{font-size:.7rem;color:#bbf7d0}
    .refresh-btn{background:rgba(255,255,255,.18);border:none;color:#fff;border-radius:8px;padding:6px 12px;font-size:.72rem;cursor:pointer;font-weight:600}

    /* Summary */
    .summary{background:#fff;border-bottom:2px solid #d1fae5;padding:10px 14px;display:flex;gap:20px}
    .s-item .val{font-size:1.25rem;font-weight:800;color:#15803d}
    .s-item .lbl{font-size:.62rem;color:#6b7280;text-transform:uppercase;letter-spacing:.04em}

    /* Area filters */
    .area-bar{background:#fff;border-bottom:1px solid #e5e7eb;padding:8px 10px;display:flex;gap:6px;overflow-x:auto;flex-wrap:wrap}
    .area-btn{border:1.5px solid #d1d5db;border-radius:20px;padding:6px 14px;font-size:.75rem;font-weight:600;cursor:pointer;background:#fff;color:#374151;white-space:nowrap}
    .area-btn.active{background:#15803d;border-color:#15803d;color:#fff}

    /* Table wrapper */
    .table-wrap{overflow-x:auto;padding:10px 10px 80px}
    table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 6px rgba(0,0,0,.07);font-size:.82rem;min-width:600px}
    thead tr{background:#052e16}
    th{padding:10px 12px;color:#86efac;font-size:.65rem;text-transform:uppercase;letter-spacing:.06em;text-align:left;font-weight:700;white-space:nowrap}
    tbody tr{border-bottom:1px solid #f0fdf4;transition:background .1s}
    tbody tr:hover{background:#f0fdf4}
    tbody tr.delivered-row{opacity:.55}
    td{padding:10px 12px;vertical-align:middle}

    .order-ref{font-size:.7rem;font-weight:800;color:#15803d;background:#f0fdf4;border-radius:6px;padding:2px 7px;display:inline-block}
    .cust-name{font-weight:700;color:#111827}
    .phone-cell{white-space:nowrap}
    .call-btn{display:inline-flex;align-items:center;gap:4px;background:#dbeafe;color:#1e40af;border:none;border-radius:8px;padding:5px 10px;font-size:.75rem;font-weight:700;cursor:pointer;text-decoration:none}
    .items-cell{color:#374151;line-height:1.5}
    .free-tag{font-size:.65rem;color:#7c3aed;font-weight:700;background:#f3e8ff;border-radius:4px;padding:1px 5px;margin-left:3px}
    .total-cell{font-weight:800;color:#111827;font-family:monospace;white-space:nowrap}
    .coupon-tag{font-size:.65rem;color:#15803d;background:#dcfce7;border-radius:4px;padding:1px 5px;display:block;margin-top:2px}

    /* Status */
    .status-sel{border:1.5px solid #d1d5db;border-radius:8px;padding:5px 8px;font-size:.75rem;font-weight:600;cursor:pointer;background:#fff;color:#374151;outline:none}
    .status-sel.s-new      {border-color:#fbbf24;color:#854d0e;background:#fef9c3}
    .status-sel.s-confirmed{border-color:#60a5fa;color:#1e40af;background:#dbeafe}
    .status-sel.s-out      {border-color:#fb923c;color:#c2410c;background:#fff7ed}
    .status-sel.s-delivered{border-color:#4ade80;color:#15803d;background:#dcfce7}

    .empty-row td{text-align:center;padding:2.5rem;color:#6b7280}
    .footer{text-align:center;padding:10px;font-size:.68rem;color:#9ca3af;position:fixed;bottom:0;left:0;right:0;background:#f0fdf4;border-top:1px solid #d1fae5}
  </style>
</head>
<body>

<!-- PIN -->
<div id="pin-screen">
  <div class="pin-logo">🥬</div>
  <div class="pin-brand">Absolute Fresh</div>
  <div class="pin-sub">Dispatch Board</div>
  <div class="pin-box">
    <div class="pin-label">Enter PIN</div>
    <input id="pin-inp" class="pin-input" type="password" inputmode="numeric" maxlength="6" placeholder="••••" onkeydown="if(event.key==='Enter')checkPin()"/>
    <div class="pin-err" id="pin-err"></div>
    <button class="pin-btn" onclick="checkPin()">Open →</button>
  </div>
</div>

<!-- App -->
<div id="app">
  <div class="top-bar">
    <div>
      <div class="top-bar-title">🥬 Dispatch Board</div>
      <div class="top-bar-meta" id="top-meta"></div>
    </div>
    <button class="refresh-btn" onclick="loadOrders()">↻ Refresh</button>
  </div>

  <div class="summary">
    <div class="s-item"><div class="val" id="s-total">—</div><div class="lbl">Orders</div></div>
    <div class="s-item"><div class="val" id="s-pending" style="color:#c2410c">—</div><div class="lbl">Pending</div></div>
    <div class="s-item"><div class="val" id="s-done" style="color:#15803d">—</div><div class="lbl">Delivered</div></div>
  </div>

  <div class="area-bar" id="area-bar">
    <button class="area-btn active" onclick="setArea('',this)">All Areas</button>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Customer</th>
          <th>Phone</th>
          <th>Address</th>
          <th>Items</th>
          <th>Total</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="orders-tbody">
        <tr class="empty-row"><td colspan="8">Loading…</td></tr>
      </tbody>
    </table>
  </div>

  <div class="footer" id="footer-note">Auto-refreshes every 90s</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://fbfopgzblqmsflkfejwa.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZiZm9wZ3pibHFtc2Zsa2ZlandhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU4MzExOTksImV4cCI6MjA5MTQwNzE5OX0.IL23Wfgq4kMW1UYQNM4gieCL7rLCTTUtAAWwVwUH6kY';
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const DISPATCH_PIN = '9988';

  let allOrders = [];
  let currentArea = '';

  function checkPin() {
    const val = document.getElementById('pin-inp').value.trim();
    if (val === DISPATCH_PIN) {
      document.getElementById('pin-screen').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      initApp();
    } else {
      document.getElementById('pin-err').textContent = 'Wrong PIN.';
      document.getElementById('pin-inp').value = '';
    }
  }

  async function initApp() {
    const now = new Date();
    document.getElementById('top-meta').textContent =
      now.toLocaleDateString('en-IN', {weekday:'short', day:'numeric', month:'short'});
    await loadAreaFilters();
    await loadOrders();
    setInterval(loadOrders, 90000);
  }

  async function loadAreaFilters() {
    const { data } = await db.from('service_areas').select('pincode,area_name').eq('is_active', true).order('area_name');
    const bar = document.getElementById('area-bar');
    (data || []).forEach(a => {
      const btn = document.createElement('button');
      btn.className = 'area-btn';
      btn.textContent = a.area_name || a.pincode;
      btn.onclick = () => setArea(a.pincode, btn);
      bar.appendChild(btn);
    });
  }

  function setArea(pincode, btn) {
    currentArea = pincode;
    document.querySelectorAll('.area-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderTable();
  }

  async function loadOrders() {
    const today = new Date().toISOString().split('T')[0];
    const tomorrow = new Date(); tomorrow.setDate(tomorrow.getDate()+1);
    const tomorrowStr = tomorrow.toISOString().split('T')[0];

    const { data, error } = await db
      .from('web_orders')
      .select('*')
      .in('delivery_date', [today, tomorrowStr])
      .neq('status', 'cancelled')
      .order('created_at', { ascending: true });

    if (error) {
      document.getElementById('orders-tbody').innerHTML =
        `<tr class="empty-row"><td colspan="7">Error: ${error.message}</td></tr>`;
      return;
    }

    allOrders = data || [];
    document.getElementById('footer-note').textContent =
      'Updated ' + new Date().toLocaleTimeString('en-IN', {hour:'2-digit', minute:'2-digit'}) + ' · Auto-refreshes every 90s';
    updateSummary();
    renderTable();
  }

  function updateSummary() {
    const filtered = currentArea ? allOrders.filter(o => o.customer_pincode === currentArea) : allOrders;
    document.getElementById('s-total').textContent   = filtered.length;
    document.getElementById('s-pending').textContent = filtered.filter(o => o.status !== 'delivered').length;
    document.getElementById('s-done').textContent    = filtered.filter(o => o.status === 'delivered').length;
  }

  function renderTable() {
    updateSummary();
    const orders = currentArea
      ? allOrders.filter(o => o.customer_pincode === currentArea)
      : allOrders;

    const tbody = document.getElementById('orders-tbody');
    if (!orders.length) {
      tbody.innerHTML = '<tr class="empty-row"><td colspan="8">No orders' + (currentArea ? ' for this area' : ' today') + '</td></tr>';
      return;
    }

    tbody.innerHTML = orders.map((o, i) => {
      // Parse items
      let items = [];
      try { items = typeof o.items === 'string' ? JSON.parse(o.items) : (o.items || []); } catch(e) {}

      const itemsHtml = items.map(item => {
        const name = item.name || item.product || '—';
        const qty  = item.qty || item.quantity || item.packs || 0;
        const isFree = item.free === true;
        return `<div>${isFree ? '<span class="free-tag">FREE</span> ' : ''}${name} × ${qty}</div>`;
      }).join('') || '—';

      const couponHtml = o.coupon_code
        ? `<span class="coupon-tag">🎟 ${o.coupon_code}</span>` : '';

      const status = o.status || 'new';
      const statusClass = {new:'s-new',pending:'s-new',confirmed:'s-confirmed',out_for_delivery:'s-out',delivered:'s-delivered'}[status] || 's-new';
      const isDelivered = status === 'delivered';

      return `<tr class="${isDelivered ? 'delivered-row' : ''}">
        <td><span class="order-ref">${o.order_ref || ('#' + (i+1))}</span></td>
        <td><span class="cust-name">${o.customer_name || '—'}</span></td>
        <td class="phone-cell">
          ${o.customer_phone
            ? `<a class="call-btn" href="tel:${o.customer_phone}">📞 ${o.customer_phone}</a>`
            : '—'}
        </td>
        <td style="font-size:.78rem;color:#374151;max-width:160px">
          ${o.customer_address || '—'}
          ${o.customer_pincode ? `<br/><span style="color:#6b7280;font-size:.7rem">${o.customer_pincode}</span>` : ''}
        </td>
        <td class="items-cell">${itemsHtml}${couponHtml}</td>
        <td class="total-cell">₹${o.total || 0}</td>
        <td>
          <select class="status-sel ${statusClass}" onchange="updateStatus('${o.id}', this)">
            <option value="new"             ${status==='new'||status==='pending'?'selected':''}>🟡 New</option>
            <option value="confirmed"       ${status==='confirmed'?'selected':''}>🔵 Confirmed</option>
            <option value="out_for_delivery"${status==='out_for_delivery'?'selected':''}>🟠 Out</option>
            <option value="delivered"       ${status==='delivered'?'selected':''}>🟢 Delivered</option>
          </select>
        </td>
        <td style="white-space:nowrap">
          ${o.customer_address ? `<a href="https://maps.google.com/?q=${encodeURIComponent((o.customer_address||'')+' '+(o.customer_pincode||''))}" target="_blank" style="display:inline-flex;align-items:center;gap:4px;background:#fef3c7;color:#92400e;border-radius:8px;padding:5px 10px;font-size:.75rem;font-weight:700;text-decoration:none">🗺 Map</a>` : '—'}
        </td>
      </tr>`;
    }).join('');
  }

  async function updateStatus(id, sel) {
    const newStatus = sel.value;
    const statusClass = {new:'s-new',confirmed:'s-confirmed',out_for_delivery:'s-out',delivered:'s-delivered'}[newStatus] || 's-new';
    sel.className = 'status-sel ' + statusClass;
    await db.from('web_orders').update({ status: newStatus, updated_at: new Date().toISOString() }).eq('id', id);
    const order = allOrders.find(o => o.id === id);
    if (order) { order.status = newStatus; updateSummary(); }
    // Grey out row if delivered
    const row = sel.closest('tr');
    if (newStatus === 'delivered') row.classList.add('delivered-row');
    else row.classList.remove('delivered-row');
  }
</script>
</body>
</html>
