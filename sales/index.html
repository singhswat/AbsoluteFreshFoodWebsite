<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Absolute Fresh — Operations Portal</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      background:#0D0D0D;
      min-height:100vh;min-height:100dvh;
      display:flex;flex-direction:column;
      color:#CBD5E1;
    }

    /* ── Hero Banner ── */
    .hero{
      background:linear-gradient(160deg,#1a0000 0%,#0D0D0D 60%);
      border-bottom:1px solid #1E1E1E;
      padding:28px 20px 0;
      display:flex;
      flex-direction:column;
      align-items:center;
      overflow:hidden;
      position:relative;
    }
    .hero::before{
      content:'';
      position:absolute;
      top:-60px;right:-60px;
      width:300px;height:300px;
      background:radial-gradient(circle,rgba(180,0,0,.18) 0%,transparent 70%);
      pointer-events:none;
    }

    .logo-img{
      height:44px;
      width:auto;
      object-fit:contain;
      margin-bottom:6px;
    }
    .portal-label{
      font-size:.7rem;
      color:#475569;
      text-transform:uppercase;
      letter-spacing:.1em;
      margin-bottom:20px;
    }

    /* Product showcase strip */
    .product-strip{
      display:flex;
      align-items:flex-end;
      gap:0;
      justify-content:center;
      max-width:500px;
      width:100%;
    }
    .product-pack{
      height:180px;
      width:auto;
      object-fit:contain;
      filter:drop-shadow(0 8px 24px rgba(0,0,0,.6));
      transform:rotate(-4deg) translateY(4px);
      transition:transform .3s;
    }
    .product-pack:hover{transform:rotate(0deg) translateY(0)}
    .product-pack.second{
      transform:rotate(4deg) translateY(4px) scale(.88);
      opacity:.8;
      margin-left:-24px;
    }
    .product-pack.second:hover{transform:rotate(0deg) translateY(0) scale(.88);opacity:1}

    /* Product labels under strip */
    .product-names{
      display:flex;
      gap:16px;
      justify-content:center;
      padding:8px 0 16px;
      font-size:.64rem;
      color:#475569;
      letter-spacing:.04em;
      text-transform:uppercase;
    }

    /* ── Main grid ── */
    .grid{
      flex:1;
      display:grid;
      grid-template-columns:1fr;
      gap:12px;
      padding:16px 16px 32px;
      max-width:480px;
      margin:0 auto;
      width:100%;
    }
    @media(min-width:620px){
      .grid{grid-template-columns:1fr 1fr;max-width:880px}
      .card-admin{grid-column:1/-1}
    }

    /* ── Cards ── */
    .card{
      background:#111111;
      border:1px solid #1E1E1E;
      border-radius:18px;
      padding:20px 18px 18px;
      cursor:pointer;
      text-decoration:none;
      display:block;
      position:relative;
      overflow:hidden;
      transition:transform .15s, border-color .15s, box-shadow .15s;
    }
    .card:hover{
      transform:translateY(-2px);
      box-shadow:0 14px 40px rgba(0,0,0,.5);
    }
    .card:active{transform:translateY(0)}

    .card::before{
      content:'';
      position:absolute;
      top:0;left:0;right:0;
      height:2px;
      border-radius:18px 18px 0 0;
    }
    .card-admin::before  {background:linear-gradient(90deg,#CC0000,#FF4444)}
    .card-partner::before{background:linear-gradient(90deg,#14532D,#22C55E)}
    .card-salesrep::before{background:linear-gradient(90deg,#1D4ED8,#60A5FA)}

    .card-admin  {border-color:#2A0000}
    .card-partner{border-color:#0D2B18}
    .card-salesrep{border-color:#0D1F3C}

    .card-admin:hover  {border-color:#CC0000}
    .card-partner:hover{border-color:#22C55E}
    .card-salesrep:hover{border-color:#60A5FA}

    .card-icon{font-size:2rem;line-height:1;margin-bottom:10px}
    .card-title{font-size:1.05rem;font-weight:700;color:#F1F5F9;margin-bottom:4px}
    .card-desc{font-size:.78rem;color:#64748B;line-height:1.55;margin-bottom:12px}

    /* Module chips */
    .chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px}
    .chip{
      border-radius:5px;
      padding:2px 8px;
      font-size:.62rem;
      font-weight:600;
      letter-spacing:.02em;
    }
    .chip-red   {background:#1A0000;color:#F87171;border:1px solid #3A0000}
    .chip-green {background:#052e16;color:#4ADE80;border:1px solid #14532D}
    .chip-blue  {background:#061520;color:#7DD3FC;border:1px solid #0C2A3E}

    .card-cta{
      display:inline-flex;align-items:center;gap:5px;
      font-size:.78rem;font-weight:700;letter-spacing:.02em;
    }
    .cta-red  {color:#F87171}
    .cta-green{color:#4ADE80}
    .cta-blue {color:#7DD3FC}

    .arrow{font-size:.85rem;transition:transform .15s}
    .card:hover .arrow{transform:translateX(4px)}

    .status-badge{
      position:absolute;top:14px;right:14px;
      font-size:.58rem;font-weight:700;
      padding:2px 7px;border-radius:5px;
      letter-spacing:.05em;text-transform:uppercase;
    }
    .badge-live{background:#052e16;color:#4ADE80;border:1px solid #166534}
    .badge-soon{background:#1c1917;color:#57534E;border:1px solid #292524}

    /* Admin card two-col modules on wider screens */
    @media(min-width:620px){
      .admin-modules{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
    }
    .admin-modules{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px}

    /* ── Footer ── */
    .footer{
      text-align:center;padding:14px;
      font-size:.65rem;color:#1E1E1E;
    }
  </style>
</head>
<body>

<!-- Hero -->
<div class="hero">
  <img src="images/logo.png" alt="Absolute Fresh" class="logo-img"/>
  <div class="portal-label">Operations Portal</div>
  <div class="product-strip">
    <img src="images/idli-dosa-batter.png" alt="Idli &amp; Dosa Batter" class="product-pack"/>
    <img src="images/idli-dosa-batter.png" alt="Podi Chutney" class="product-pack second"/>
  </div>
  <div class="product-names">
    <span>Idli &amp; Dosa Batter</span>
    <span>Podi Chutney</span>
  </div>
</div>

<!-- CTA -->
<div style="display:flex;flex-direction:column;align-items:center;gap:12px;padding:20px 16px 32px;width:100%;max-width:380px;margin:0 auto">
  <a href="login.html" style="
    display:block;width:100%;background:#CC0000;color:#fff;
    border-radius:12px;padding:16px;text-align:center;
    font-size:1rem;font-weight:700;text-decoration:none;
    letter-spacing:.01em;transition:background .15s;
  ">Sign In →</a>

  <a href="signup.html" style="
    display:block;width:100%;background:#111111;color:#94A3B8;
    border:1px solid #1E1E1E;border-radius:12px;padding:15px;text-align:center;
    font-size:.88rem;font-weight:600;text-decoration:none;
    letter-spacing:.01em;transition:border-color .15s;
  ">New here? Join as Partner or Sales Team →</a>

  <div style="display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:6px">
    <span style="font-size:.65rem;background:#111;border:1px solid #1E1E1E;color:#475569;padding:3px 9px;border-radius:5px">👥 Partners</span>
    <span style="font-size:.65rem;background:#111;border:1px solid #1E1E1E;color:#475569;padding:3px 9px;border-radius:5px">🛡️ Admin</span>
    <span style="font-size:.65rem;background:#111;border:1px solid #1E1E1E;color:#475569;padding:3px 9px;border-radius:5px">📱 Sales Reps</span>
    <span style="font-size:.65rem;background:#111;border:1px solid #1E1E1E;color:#475569;padding:3px 9px;border-radius:5px">🚚 Drivers</span>
  </div>
</div>

<div class="footer">© 2026 Absolute Fresh Food Pvt. Ltd. · All rights reserved.</div>

</body>
</html>
