<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-FL4T5WHM8W"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-FL4T5WHM8W');
  </script>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Forgot Password — Absolute Fresh</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      background:linear-gradient(160deg,#16A34A 0%,#14532D 100%);
      min-height:100vh;min-height:100dvh;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      padding:24px 16px;
    }

    .logo-area{text-align:center;margin-bottom:28px;color:#fff}
    .logo{font-size:3rem;line-height:1;margin-bottom:8px}
    .brand{font-size:1.1rem;font-weight:700}
    .tagline{font-size:.78rem;opacity:.7;margin-top:3px}

    .card{
      background:#fff;border-radius:20px;
      padding:28px 20px 24px;
      width:100%;max-width:400px;
      box-shadow:0 20px 60px rgba(0,0,0,.25);
    }

    h2{font-size:1.2rem;font-weight:700;color:#111827;margin-bottom:4px}
    .sub{font-size:.82rem;color:#6B7280;margin-bottom:24px;line-height:1.5}

    .field{margin-bottom:18px}
    .field label{
      display:block;font-size:.72rem;font-weight:700;
      color:#374151;margin-bottom:7px;
      text-transform:uppercase;letter-spacing:.06em;
    }
    .input-wrap{position:relative}
    .input-wrap .ico{
      position:absolute;left:13px;top:50%;
      transform:translateY(-50%);font-size:1.05rem;pointer-events:none;
    }
    input{
      width:100%;padding:14px 14px 14px 42px;
      border:1.5px solid #E5E7EB;border-radius:10px;
      font-size:1rem;font-family:inherit;
      outline:none;transition:border .15s;
      -webkit-appearance:none;background:#fff;
    }
    input:focus{border-color:#16A34A}

    .error{
      background:#FEF2F2;border:1px solid #FECACA;
      color:#B91C1C;border-radius:8px;
      padding:11px 13px;font-size:.83rem;
      margin-bottom:16px;display:none;line-height:1.4;
    }
    .error.show{display:block}

    .success{
      text-align:center;padding:20px 10px;
    }
    .success .big{font-size:2.5rem;margin-bottom:10px}
    .success h3{font-size:1.1rem;font-weight:700;color:#111827;margin-bottom:6px}
    .success p{font-size:.83rem;color:#6B7280;line-height:1.5}

    .submit{
      width:100%;background:#16A34A;color:#fff;border:none;
      border-radius:12px;padding:15px;
      font-size:1rem;font-weight:700;cursor:pointer;
      margin-top:4px;transition:background .15s;
    }
    .submit:active{background:#15803D}
    .submit:disabled{opacity:.5;cursor:not-allowed}

    .footer{
      text-align:center;margin-top:24px;
      font-size:.83rem;color:rgba(255,255,255,.8);
    }
    .footer a{color:#fff;font-weight:700;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.4)}
  </style>
</head>
<body>

<div class="logo-area">
  <div class="logo">🥬</div>
  <div class="brand">Absolute Fresh</div>
  <div class="tagline">Partner Portal</div>
</div>

<div class="card">
  <div id="form-view">
    <h2>Forgot Password?</h2>
    <p class="sub">Enter your registered email address and we'll send you a reset link.</p>

    <div id="error" class="error"></div>

    <form id="form">
      <div class="field">
        <label>Email Address</label>
        <div class="input-wrap">
          <span class="ico">✉️</span>
          <input id="email" type="email" inputmode="email"
                 placeholder="your@email.com"
                 autocomplete="email" required/>
        </div>
      </div>
      <button type="submit" class="submit" id="submit-btn">Send Reset Link →</button>
    </form>
  </div>

  <div id="success-view" class="success" style="display:none">
    <div class="big">📬</div>
    <h3>Check your email!</h3>
    <p>We've sent a password reset link to your email address. It expires in <strong>1 hour</strong>.</p>
  </div>
</div>

<div class="footer">
  Remember it? <a href="login.html">Back to Login</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://fbfopgzblqmsflkfejwa.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_r7mYhsyIKtBjBKzxH8St9g_OHjTU-RQ';
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  function generateToken() {
    const arr = new Uint8Array(24);
    crypto.getRandomValues(arr);
    return Array.from(arr).map(b => b.toString(16).padStart(2,'0')).join('');
  }

  document.getElementById('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    const err = document.getElementById('error');
    const email = document.getElementById('email').value.trim().toLowerCase();

    btn.disabled = true;
    btn.textContent = 'Sending...';
    err.classList.remove('show');

    try {
      // Look up influencer by email
      const { data: inf, error } = await db
        .from('influencers')
        .select('id, name, email')
        .eq('email', email)
        .single();

      // Always show success (don't reveal if email exists)
      if (!inf || error) {
        document.getElementById('form-view').style.display = 'none';
        document.getElementById('success-view').style.display = 'block';
        return;
      }

      // Generate token + save to Supabase
      const token = generateToken();
      const expires = new Date(Date.now() + 60 * 60 * 1000).toISOString(); // 1 hour

      await db.from('influencers').update({
        reset_token: token,
        reset_token_expires: expires
      }).eq('id', inf.id);

      // Build reset link
      const resetLink = `https://absolutefreshfood.com/marketing/reset-password.html?token=${token}&email=${encodeURIComponent(email)}`;

      // Send email via PHP mailer
      await fetch('send-reset.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: inf.email, name: inf.name, reset_link: resetLink })
      });

      document.getElementById('form-view').style.display = 'none';
      document.getElementById('success-view').style.display = 'block';

    } catch(ex) {
      // Still show success to avoid exposing info
      document.getElementById('form-view').style.display = 'none';
      document.getElementById('success-view').style.display = 'block';
    }
  });
</script>
</body>
</html>
