<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Redirect to unified login -->
  <script>location.replace('../login.html');</script>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-FL4T5WHM8W"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-FL4T5WHM8W');
  </script>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Partner Login — Absolute Fresh</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      background:linear-gradient(160deg,#16A34A 0%,#14532D 100%);
      min-height:100vh;min-height:100dvh;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      padding:24px 16px;
    }

    .logo-area{text-align:center;margin-bottom:28px;color:#fff}
    .logo{font-size:3.2rem;line-height:1;margin-bottom:8px}
    .brand{font-size:1.15rem;font-weight:700;letter-spacing:.01em}
    .tagline{font-size:.78rem;opacity:.7;margin-top:3px}

    .card{
      background:#fff;border-radius:20px;
      padding:28px 20px 24px;
      width:100%;max-width:400px;
      box-shadow:0 20px 60px rgba(0,0,0,.25);
    }

    h2{font-size:1.25rem;font-weight:700;color:#111827;margin-bottom:4px}
    .sub{font-size:.82rem;color:#6B7280;margin-bottom:24px}

    .field{margin-bottom:18px}
    .field label{
      display:block;font-size:.72rem;font-weight:700;
      color:#374151;margin-bottom:7px;
      text-transform:uppercase;letter-spacing:.06em;
    }
    .input-wrap{position:relative}
    .input-wrap .ico{
      position:absolute;left:13px;top:50%;
      transform:translateY(-50%);font-size:1.05rem;pointer-events:none;
    }
    input{
      width:100%;padding:14px 14px 14px 42px;
      border:1.5px solid #E5E7EB;border-radius:10px;
      font-size:1rem;font-family:inherit;
      outline:none;transition:border .15s;
      -webkit-appearance:none;background:#fff;
    }
    input:focus{border-color:#16A34A;background:#fff}
    input[type=tel]{letter-spacing:.06em;font-size:1.05rem}
    .pw-input{padding-right:60px}

    .pw-toggle{
      position:absolute;right:12px;top:50%;transform:translateY(-50%);
      background:none;border:none;cursor:pointer;
      font-size:.78rem;font-weight:600;color:#6B7280;padding:6px 4px;
    }

    .error{
      background:#FEF2F2;border:1px solid #FECACA;
      color:#B91C1C;border-radius:8px;
      padding:11px 13px;font-size:.83rem;
      margin-bottom:16px;display:none;line-height:1.4;
    }
    .error.show{display:block}

    .submit{
      width:100%;background:#16A34A;color:#fff;border:none;
      border-radius:12px;padding:15px;
      font-size:1rem;font-weight:700;cursor:pointer;
      letter-spacing:.01em;margin-top:4px;
      transition:background .15s;
    }
    .submit:active{background:#15803D}
    .submit:disabled{opacity:.5;cursor:not-allowed}

    .footer{
      text-align:center;margin-top:24px;
      font-size:.83rem;color:rgba(255,255,255,.8);
    }
    .footer a{color:#fff;font-weight:700;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.4)}
  </style>
</head>
<body>

<div class="logo-area">
  <img src="../images/logo.png" alt="Absolute Fresh" style="height:46px;width:auto;object-fit:contain;margin-bottom:6px;filter:brightness(0) invert(1)"/>
  <div class="tagline" style="font-size:.78rem;opacity:.7;margin-top:4px">Partner Portal</div>
</div>

<div class="card">
  <h2>Welcome back 👋</h2>
  <p class="sub">Enter your registered email & password</p>

  <div id="error" class="error"></div>

  <form id="form">
    <div class="field">
      <label>Email Address</label>
      <div class="input-wrap">
        <span class="ico">✉️</span>
        <input id="email" type="email" inputmode="email"
               placeholder="your@email.com"
               autocomplete="email" required/>
      </div>
    </div>

    <div class="field">
      <label>Password</label>
      <div class="input-wrap">
        <span class="ico">🔒</span>
        <input id="password" type="password" class="pw-input"
               placeholder="Your password"
               autocomplete="current-password" required/>
        <button type="button" class="pw-toggle" id="pw-btn" onclick="togglePw()">Show</button>
      </div>
    </div>

    <button type="submit" class="submit" id="submit-btn">Log In →</button>
    <a href="forgot-password.html" style="display:block;text-align:center;margin-top:14px;font-size:.82rem;color:#6B7280;text-decoration:none;">
      Forgot password?
    </a>
  </form>
</div>

<div class="footer">
  New partner? <a href="signup.html">Sign up here</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://fbfopgzblqmsflkfejwa.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_r7mYhsyIKtBjBKzxH8St9g_OHjTU-RQ';
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  function togglePw() {
    const inp = document.getElementById('password');
    const btn = document.getElementById('pw-btn');
    inp.type = inp.type === 'password' ? 'text' : 'password';
    btn.textContent = inp.type === 'password' ? 'Show' : 'Hide';
  }

  async function hashPassword(pw) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pw));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
  }

  document.getElementById('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    const err = document.getElementById('error');
    const email = document.getElementById('email').value.trim().toLowerCase();
    const password = document.getElementById('password').value;

    if (!email) {
      err.textContent = 'Please enter your email address.';
      err.classList.add('show'); return;
    }

    btn.disabled = true;
    btn.textContent = 'Logging in...';
    err.classList.remove('show');

    try {
      const { data: inf, error } = await db
        .from('influencers')
        .select('id,name,email,status,password_hash,discount_ceiling,total_orders,total_revenue,total_commission_earned')
        .eq('email', email)
        .single();

      if (error || !inf) {
        err.textContent = 'Email not registered. Please sign up first.';
        err.classList.add('show');
        btn.disabled = false; btn.textContent = 'Log In →'; return;
      }

      if (inf.status !== 'approved') {
        err.textContent = 'Your account is pending approval. We\'ll notify you soon.';
        err.classList.add('show');
        btn.disabled = false; btn.textContent = 'Log In →'; return;
      }

      const hashed = await hashPassword(password);
      if (inf.password_hash !== hashed) {
        err.textContent = 'Incorrect password. Please try again.';
        err.classList.add('show');
        btn.disabled = false; btn.textContent = 'Log In →'; return;
      }

      localStorage.setItem('influencer', JSON.stringify(inf));
      location.href = 'dashboard.html';

    } catch(ex) {
      err.textContent = 'Login failed. Please check your connection and try again.';
      err.classList.add('show');
      btn.disabled = false; btn.textContent = 'Log In →';
    }
  });
</script>
</body>
</html>
