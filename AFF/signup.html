<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Join Absolute Fresh</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      background:#f9fafb;color:#1f2937;
      min-height:100vh;min-height:100dvh;
      display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
      padding:28px 16px 48px;
    }

    .logo-wrap{text-align:center;margin-bottom:28px}
    .logo-wrap img{height:40px;width:auto;object-fit:contain}

    .card{
      background:#fff;border-radius:20px;
      box-shadow:0 2px 16px rgba(0,0,0,.08);
      padding:28px 24px;width:100%;max-width:420px;
    }

    /* Role picker */
    #step-pick h2{font-size:1.3rem;font-weight:800;color:#111827;margin-bottom:6px;text-align:center}
    #step-pick p{font-size:.82rem;color:#6b7280;text-align:center;margin-bottom:22px}

    .role-btns{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .role-btn{
      border:2.5px solid #e5e7eb;border-radius:16px;padding:22px 12px;
      cursor:pointer;text-align:center;background:#fff;transition:border-color .15s,background .15s;
    }
    .role-btn:hover{border-color:#16a34a;background:#f0fdf4}
    .role-btn .rb-icon{font-size:2.4rem;margin-bottom:8px}
    .role-btn .rb-title{font-size:.95rem;font-weight:700;color:#111827}
    .role-btn .rb-desc{font-size:.72rem;color:#6b7280;margin-top:4px;line-height:1.4}

    /* Form step */
    #step-form{display:none;width:100%;max-width:420px}

    .role-badge{
      display:inline-flex;align-items:center;gap:6px;
      border-radius:99px;padding:5px 14px;font-size:.75rem;font-weight:700;
      margin-bottom:18px;
    }
    .badge-influencer{background:#dcfce7;color:#15803d}
    .badge-partner   {background:#dbeafe;color:#1d4ed8}

    .form-title{font-size:1.15rem;font-weight:800;color:#111827;margin-bottom:4px}
    .form-sub  {font-size:.78rem;color:#6b7280;margin-bottom:20px}

    .field{margin-bottom:14px}
    label{display:block;font-size:.7rem;font-weight:700;color:#374151;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
    input, select{
      width:100%;border:1.5px solid #d1d5db;border-radius:10px;
      padding:13px 14px;font-size:.92rem;font-family:inherit;
      background:#fff;color:#111827;outline:none;transition:border .15s;
      -webkit-appearance:none;appearance:none;
    }
    input:focus, select:focus{border-color:#16a34a}
    input::placeholder{color:#9ca3af}

    .error{
      background:#fef2f2;border:1px solid #fca5a5;color:#dc2626;
      border-radius:9px;padding:10px 12px;font-size:.78rem;
      margin-bottom:14px;display:none;line-height:1.4;
    }
    .error.show{display:block}

    .submit-btn{
      width:100%;border:none;border-radius:12px;padding:15px;
      font-size:.98rem;font-weight:800;cursor:pointer;
      background:#16a34a;color:#fff;letter-spacing:.01em;
      transition:background .15s;margin-top:6px;
    }
    .submit-btn:hover{background:#15803d}
    .submit-btn:disabled{opacity:.5;cursor:not-allowed}

    .back-link{
      display:inline-block;margin-bottom:16px;
      font-size:.78rem;color:#6b7280;cursor:pointer;border:none;background:none;padding:0;
    }
    .back-link:hover{color:#374151}

    /* Success */
    #step-done{display:none;text-align:center;max-width:380px;padding:0 8px}
    .done-icon{font-size:3.8rem;margin-bottom:16px}
    .done-title{font-size:1.2rem;font-weight:800;color:#111827;margin-bottom:8px}
    .done-msg{font-size:.84rem;color:#6b7280;line-height:1.65;margin-bottom:24px}
    .platform-checks{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}
    .chk{
      display:flex;align-items:center;gap:6px;
      background:#f9fafb;border:1.5px solid #e5e7eb;border-radius:8px;
      padding:8px 12px;font-size:.84rem;color:#374151;cursor:pointer;
      transition:border-color .15s,background .15s;font-weight:normal;
      text-transform:none;letter-spacing:0;
    }
    .chk:hover{border-color:#16a34a;background:#f0fdf4}
    .chk input[type="checkbox"]{width:16px;height:16px;accent-color:#16a34a;cursor:pointer}

    .done-back{
      display:inline-block;background:#16a34a;color:#fff;
      border-radius:12px;padding:13px 32px;font-weight:700;font-size:.9rem;
      text-decoration:none;
    }
  </style>
</head>
<body>

<div class="logo-wrap">
  <img src="images/logo.png" alt="Absolute Fresh"/>
</div>

<!-- Step 1: Role picker (shown when no ?role param) -->
<div class="card" id="step-pick">
  <h2>Join Absolute Fresh</h2>
  <p>How would you like to work with us?</p>
  <div class="role-btns">
    <div class="role-btn" onclick="selectRole('influencer')">
      <div class="rb-icon">📸</div>
      <div class="rb-title">Influencer</div>
      <div class="rb-desc">Promote us &amp; earn commissions</div>
    </div>
    <div class="role-btn" onclick="selectRole('partner')">
      <div class="rb-icon">🤝</div>
      <div class="rb-title">Partner</div>
      <div class="rb-desc">Society, store, or business tie-up</div>
    </div>
  </div>
</div>

<!-- Step 2: Simple form -->
<div id="step-form">
  <button class="back-link" onclick="goBack()">← Back</button>
  <div class="card">
    <div id="role-badge" class="role-badge"></div>
    <div class="form-title" id="form-title"></div>
    <div class="form-sub"  id="form-sub"></div>
    <div id="form-error" class="error"></div>

    <div class="field">
      <label>Your Name *</label>
      <input id="f-name" placeholder="Full name" autocomplete="name"/>
    </div>
    <div class="field">
      <label>WhatsApp Number *</label>
      <input id="f-phone" type="tel" inputmode="numeric" placeholder="10-digit number" autocomplete="tel"/>
    </div>
    <div class="field">
      <label>City *</label>
      <input id="f-city" placeholder="Lucknow"/>
    </div>
    <div class="field" id="field-insta">
      <label>Instagram / Social Handle</label>
      <input id="f-insta" placeholder="@yourhandle"/>
    </div>

    <div class="field">
      <label>Where will you promote?</label>
      <div class="platform-checks">
        <label class="chk"><input type="checkbox" value="instagram"/> Instagram</label>
        <label class="chk"><input type="checkbox" value="youtube"/> YouTube</label>
        <label class="chk"><input type="checkbox" value="whatsapp"/> WhatsApp</label>
        <label class="chk"><input type="checkbox" value="facebook"/> Facebook</label>
        <label class="chk"><input type="checkbox" value="society"/> Society / Apartment</label>
        <label class="chk"><input type="checkbox" value="other"/> Other</label>
      </div>
    </div>

    <button class="submit-btn" id="submit-btn" onclick="submitForm()">Submit →</button>
  </div>
</div>

<!-- Step 3: Done -->
<div id="step-done">
  <div class="done-icon">🎉</div>
  <div class="done-title">You're in!</div>
  <div class="done-msg" id="done-msg"></div>
  <a href="https://absolutefreshfood.com" class="done-back">Go to Website</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://fbfopgzblqmsflkfejwa.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZiZm9wZ3pibHFtc2Zsa2ZlandhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU4MzExOTksImV4cCI6MjA5MTQwNzE5OX0.IL23Wfgq4kMW1UYQNM4gieCL7rLCTTUtAAWwVwUH6kY';
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let currentRole = null;

  const roleConfig = {
    influencer: {
      badge: '📸 Influencer',
      badgeClass: 'badge-influencer',
      title: 'Become an Influencer',
      sub: 'Share your unique coupon code — earn commission on every order.',
      showInsta: true,
    },
    partner: {
      badge: '🤝 Partner',
      badgeClass: 'badge-partner',
      title: 'Become a Partner',
      sub: 'Bring Absolute Fresh to your society, store, or network.',
      showInsta: false,
    }
  };

  function selectRole(role) {
    currentRole = role;
    const cfg = roleConfig[role];
    const badge = document.getElementById('role-badge');
    badge.textContent = cfg.badge;
    badge.className = 'role-badge ' + cfg.badgeClass;
    document.getElementById('form-title').textContent = cfg.title;
    document.getElementById('form-sub').textContent   = cfg.sub;
    document.getElementById('field-insta').style.display = cfg.showInsta ? 'block' : 'none';
    document.getElementById('step-pick').style.display = 'none';
    document.getElementById('step-form').style.display = 'block';
    document.getElementById('form-error').classList.remove('show');
    document.getElementById('f-name').focus();
  }

  function goBack() {
    currentRole = null;
    document.getElementById('step-pick').style.display = 'block';
    document.getElementById('step-form').style.display = 'none';
  }

  async function submitForm() {
    const errEl = document.getElementById('form-error');
    const btn   = document.getElementById('submit-btn');
    errEl.classList.remove('show');

    const name  = document.getElementById('f-name').value.trim();
    const phone = document.getElementById('f-phone').value.trim().replace(/\D/g,'');
    const city  = document.getElementById('f-city').value.trim();
    const insta = document.getElementById('f-insta').value.trim().replace(/^@/,'');
    const platforms = [...document.querySelectorAll('.platform-checks input:checked')].map(c => c.value);

    if (!name) { errEl.textContent = 'Please enter your name.'; errEl.classList.add('show'); return; }
    if (phone.length < 10) { errEl.textContent = 'Please enter a valid 10-digit WhatsApp number.'; errEl.classList.add('show'); return; }
    if (!city) { errEl.textContent = 'Please enter your city.'; errEl.classList.add('show'); return; }

    btn.disabled = true; btn.textContent = 'Submitting…';

    const { error } = await db.from('influencers').insert({
      name,
      phone,
      city,
      instagram_handle: insta ? '@' + insta : null,
      content_type: platforms.length ? platforms.join(',') : currentRole,
      status: 'pending',
      discount_ceiling: 20,
      total_orders: 0,
      total_revenue: 0,
      total_commission_earned: 0,
    });

    if (error) {
      errEl.textContent = 'Could not submit. Please WhatsApp us at 8318767689.';
      errEl.classList.add('show');
      btn.disabled = false; btn.textContent = 'Submit →';
      return;
    }

    // Notify admin via WhatsApp Web3Forms
    fetch('https://api.web3forms.com/submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        access_key: 'e15ea46f-4d94-4d42-8677-36642692d1e1',
        subject: `New ${currentRole} signup — ${name}`,
        from_name: 'Absolute Fresh Portal',
        message: `New ${currentRole} signup:\n\nName: ${name}\nPhone: ${phone}\nCity: ${city}\nInstagram: ${insta ? '@'+insta : '—'}\n\nReview at: sales.absolutefreshfood.com/marketing/admin.html`
      })
    }).catch(() => {});

    document.getElementById('step-form').style.display = 'none';
    document.getElementById('done-msg').textContent =
      `Thanks ${name}! We've received your application and will WhatsApp you on ${phone} within 24 hours.`;
    document.getElementById('step-done').style.display = 'block';
  }

  // Auto-select from ?role= URL param
  window.addEventListener('DOMContentLoaded', () => {
    const param = new URLSearchParams(window.location.search).get('role');
    if (param === 'influencer') selectRole('influencer');
    else if (param === 'partner') selectRole('partner');
  });
</script>
</body>
</html>
